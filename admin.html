<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Reveal - 後台管理 Console</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }
        
        .auth-screen.active {
            display: flex;
        }
        
        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        
        .auth-box h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.8rem;
        }
        
        .auth-box p {
            color: #666;
            margin-bottom: 20px;
        }
        
        .auth-box input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 2px;
        }
        
        .auth-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .auth-box button:hover {
            background: #764ba2;
        }
        
        .auth-error {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 密碼驗證畫面 -->
    <div class="auth-screen active" id="auth-screen">
        <div class="auth-box">
            <h2>🔐 後台管理</h2>
            <p>請輸入管理員密碼</p>
            <input type="password" id="password-input" placeholder="輸入密碼" autocomplete="off">
            <button id="auth-submit">進入後台</button>
            <div class="auth-error" id="auth-error">❌ 密碼錯誤，請重試</div>
        </div>
    </div>

    <!-- 後台管理內容 -->
    <div class="admin-container" id="admin-content" style="display: none;">
        <div class="header">
            <h1>⚙️ 性別揭曉派對 - 後台 Console</h1>
            <p>實時管理題目、Bingo 線索與現場流程控制</p>
        </div>

        <section class="admin-card">
            <h2>1. 終極性別設定</h2>
            <div class="gender-switch">
                <button id="btn-set-boy" class="btn-boy">👦 設定為 Team Boy</button>
                <button id="btn-set-girl" class="btn-girl">👧 設定為 Team Girl</button>
            </div>
            <p>目前設定性別：<strong id="current-gender-display" style="color:var(--accent);">載入中...</strong></p>
        </section>

        <section class="admin-card">
            <h2>2. Friend Groups 管理</h2>
            <div class="input-inline">
                <input type="text" id="group-name-input" placeholder="例: 中學同學 GP">
                <button id="btn-add-group" style="width: 120px;">新增 Group</button>
            </div>
            <ul id="group-list" class="data-list"></ul>
        </section>

        <section class="admin-card">
            <h2>3. Game 1 題目管理 (專屬題 / 共同題)</h2>
            <select id="q-group-select">
                <option value="common">-- 共同題目 --</option>
            </select>
            <input type="text" id="g1-q-text" placeholder="輸入題目內容">
            <input type="text" class="g1-opt-input" placeholder="選項 1 (Index 0)">
            <input type="text" class="g1-opt-input" placeholder="選項 2 (Index 1)">
            <input type="text" class="g1-opt-input" placeholder="選項 3 (Index 2)">
            <input type="text" class="g1-opt-input" placeholder="選項 4 (Index 3)">
            <div class="input-inline" style="align-items: center;">
                <label style="white-space: nowrap; font-size: 0.85rem;">正確答案 (0-3):</label>
                <input type="number" id="g1-correct-idx" min="0" max="3" value="0">
            </div>
            <button id="btn-add-g1-q">新增 Game 1 題目</button>
            <ul id="g1-questions-list" class="data-list"></ul>
        </section>

        <section class="admin-card">
            <h2>4. Game 2 Bingo 線索管理 (建議 12-15 條)</h2>
            <div class="input-inline">
                <input type="text" id="bingo-item-input" placeholder="例: 媽媽想食辣">
                <button id="btn-add-bingo" style="width: 120px;">新增線索</button>
            </div>
            <ul id="bingo-list" class="data-list"></ul>
        </section>

        <section class="admin-card">
            <h2>5. Game 3 搶答題管理 (共 5 題)</h2>
            <input type="text" id="g3-q-text" placeholder="輸入搶答題目">
            <input type="text" class="g3-opt-input" placeholder="選項 1">
            <input type="text" class="g3-opt-input" placeholder="選項 2">
            <input type="text" class="g3-opt-input" placeholder="選項 3">
            <input type="text" class="g3-opt-input" placeholder="選項 4">
            <div class="input-inline" style="align-items: center;">
                <label style="white-space: nowrap; font-size: 0.85rem;">正確答案 (0-3):</label>
                <input type="number" id="g3-correct-idx" min="0" max="3" value="0">
            </div>
            <button id="btn-add-g3-q">新增 Game 3 搶答題</button>
            <ul id="g3-questions-list" class="data-list"></ul>
        </section>

        <section class="admin-card">
            <h2>🚀 現場關卡控制</h2>
            <div class="gender-switch" style="grid-template-columns: repeat(2, 1fr);">
                <button class="step-btn" data-step="LOGIN">1. 切換至 登入頁</button>
                <button class="step-btn" data-step="GAME1">2. 開始 Game 1</button>
                <button class="step-btn" data-step="GAME2">3. 開始 Game 2</button>
                <button class="step-btn" data-step="GAME3">4. 開始 Game 3</button>
            </div>
            <button class="btn-reveal-trigger" id="btn-trigger-reveal">🔥 觸發最終 10 秒倒數 Reveal</button>
        </section>
    </div>

    <script>
        // 密碼驗證系統
        const ADMIN_PASSWORD = "1025";
        
        function authenticateAdmin() {
            const password = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('auth-error');
            
            if (password === ADMIN_PASSWORD) {
                // 密碼正確
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('admin-content').style.display = 'block';
                // 儲存驗證狀態到 sessionStorage（重新整理頁面後需要重新輸入密碼）
                sessionStorage.setItem('adminAuthenticated', 'true');
            } else {
                // 密碼錯誤
                errorMsg.style.display = 'block';
                document.getElementById('password-input').value = '';
                document.getElementById('password-input').focus();
            }
        }
        
        // 頁面載入時檢查驗證狀態
        window.addEventListener('DOMContentLoaded', () => {
            const isAuthenticated = sessionStorage.getItem('adminAuthenticated');
            
            if (isAuthenticated === 'true') {
                // 已驗證，顯示後台
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('admin-content').style.display = 'block';
            }
            
            // 密碼輸入框回車事件
            document.getElementById('password-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    authenticateAdmin();
                }
            });
            
            // 驗證按鈕點擊事件
            document.getElementById('auth-submit').addEventListener('click', authenticateAdmin);
            
            // 焦點回到密碼輸入框
            document.getElementById('password-input').focus();
        });
    </script>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
