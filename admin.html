<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料管理後台 — Gender Reveal Party</title>

<script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-database-compat.js"></script>
<script src="config.js"></script>

<style>
  :root{
    --bg-base:#0d0f13;
    --bg-panel:#171a21;
    --bg-panel-raised:#1e222b;
    --line:#2a2f3a;
    --text-main:#e8eaf0;
    --text-dim:#8890a0;
    --accent-amber:#e8a33d;
    --accent-teal:#2dd4bf;
    --accent-red:#ef5555;
    --accent-green:#3ecf7a;
  }
  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 85% -10%, rgba(45,212,191,0.07), transparent 60%),
      var(--bg-base);
    color:var(--text-main);
    font-family:'Noto Sans TC','Space Grotesk',sans-serif;
    min-height:100vh;
  }
  .font-display{font-family:'Space Grotesk','Noto Sans TC',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  .panel{ background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; }
  .field{
    background:var(--bg-panel-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    color:var(--text-main);
    width:100%;
    font-size:14px;
  }
  .field:focus{outline:none;border-color:var(--accent-teal);}
  .btn{
    padding:8px 16px;border-radius:8px;font-weight:600;font-size:14px;
    transition:transform .1s ease, opacity .15s ease; cursor:pointer;
    font-family:'Space Grotesk','Noto Sans TC',sans-serif;
  }
  .btn:active{transform:scale(0.97);}
  .btn-amber{background:var(--accent-amber);color:#241a05;}
  .btn-teal{background:var(--accent-teal);color:#04211d;}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--text-main);}
  .btn-outline:hover{border-color:var(--accent-teal);}
  .btn-danger{background:var(--accent-red);color:#2a0505;}
  .btn-danger-outline{background:transparent;border:1px solid var(--accent-red);color:var(--accent-red);}
  .tab-btn{
    padding:10px 18px;border-radius:10px 10px 0 0;
    color:var(--text-dim); font-weight:600; cursor:pointer;
    border:1px solid transparent;
  }
  .tab-btn.is-active{
    background:var(--bg-panel); color:var(--accent-amber);
    border-color:var(--line); border-bottom-color:var(--bg-panel);
  }
  .qcard{ background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:10px; padding:16px; }
  details > summary{cursor:pointer; list-style:none;}
  details > summary::-webkit-details-marker{display:none;}
</style>
</head>
<body class="p-4 md:p-8">

<!-- ===================== 密碼閘門 ===================== -->
<div id="gate" class="fixed inset-0 z-50 flex items-center justify-center bg-[var(--bg-base)]">
  <div class="panel p-8 max-w-sm w-full text-center">
    <p class="font-mono text-xs text-[var(--text-dim)] uppercase tracking-widest mb-2">Restricted Access</p>
    <h1 class="font-display text-xl font-bold mb-6">資料管理後台</h1>
    <input id="gate-input" type="password" class="field text-center mb-4" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter') checkPassword()">
    <button onclick="checkPassword()" class="btn btn-amber w-full">進入</button>
    <p id="gate-error" class="text-[var(--accent-red)] text-xs mt-3 hidden">密碼錯誤，請再試一次。</p>
  </div>
</div>

<!-- ===================== 主內容（密碼正確後顯示） ===================== -->
<div id="main-content" class="hidden max-w-6xl mx-auto">

  <header class="mb-6">
    <p class="font-mono text-xs text-[var(--text-dim)] tracking-widest uppercase">Content Management</p>
    <h1 class="font-display text-2xl md:text-3xl font-bold">題庫與線索資料管理後台</h1>
  </header>

  <!-- Tabs -->
  <div class="flex gap-2 border-b border-[var(--line)] mb-0">
    <div class="tab-btn is-active" data-tab="exclusive" onclick="switchTab('exclusive')">專屬題</div>
    <div class="tab-btn" data-tab="common" onclick="switchTab('common')">共同題</div>
    <div class="tab-btn" data-tab="bingo" onclick="switchTab('bingo')">Bingo 句庫</div>
    <div class="tab-btn" data-tab="clues" onclick="switchTab('clues')">線索</div>
  </div>

  <div class="panel rounded-tl-none p-6">

    <!-- 專屬題 -->
    <div id="tab-exclusive" class="tab-panel">
      <div id="exclusive-groups" class="space-y-3"></div>
    </div>

    <!-- 共同題 -->
    <div id="tab-common" class="tab-panel hidden">
      <div class="flex justify-between items-center mb-4">
        <p class="text-sm text-[var(--text-dim)]">全場共同題（建議 5 題，MC 4 選 1）</p>
        <button onclick="addQuestion('common_quiz', null)" class="btn btn-teal">+ 新增共同題</button>
      </div>
      <div id="common-list" class="space-y-4"></div>
    </div>

    <!-- Bingo 句庫 -->
    <div id="tab-bingo" class="tab-panel hidden">
      <div class="flex justify-between items-center mb-4">
        <p class="text-sm text-[var(--text-dim)]">Bingo 迷信句子庫（建議 15–20 條）</p>
        <button onclick="addBingoPhrase()" class="btn btn-teal">+ 新增句子</button>
      </div>
      <div id="bingo-list" class="space-y-2"></div>
    </div>

    <!-- 線索 -->
    <div id="tab-clues" class="tab-panel hidden">
      <p class="text-sm text-[var(--text-dim)] mb-4">每個 Level 固定 3 條，可填純文字或圖片網址（圖片網址請以 http/https 開頭，系統會自動判斷並以圖片方式顯示）。</p>
      <div id="clues-container" class="space-y-6"></div>
    </div>

  </div>
</div>

<script>
firebase.initializeApp(CONFIG.firebaseConfig);
const db = firebase.database();

// ---------------- 密碼閘門 ----------------
function checkPassword(){
  const val = document.getElementById('gate-input').value;
  if (val === CONFIG.accessPassword){
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('main-content').classList.remove('hidden');
    initAdmin();
  } else {
    document.getElementById('gate-error').classList.remove('hidden');
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHtml(str).replace(/`/g, '&#96;'); }

// ---------------- Tabs ----------------
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('is-active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  document.getElementById(`tab-${tab}`).classList.remove('hidden');
}

// ---------------- 初始化 ----------------
function initAdmin(){
  renderExclusiveGroups();
  loadCommonQuiz();
  loadBingoPhrases();
  loadClues();
}

// ==================================================
// 專屬題（依 Friend Group）
// ==================================================
function renderExclusiveGroups(){
  const wrap = document.getElementById('exclusive-groups');
  wrap.innerHTML = '';
  Object.entries(CONFIG.groups).forEach(([groupId, groupName]) => {
    const details = document.createElement('details');
    details.className = 'panel p-4';
    details.innerHTML = `
      <summary class="flex justify-between items-center font-display font-semibold">
        <span>${escapeHtml(groupName)} <span class="font-mono text-xs text-[var(--text-dim)]">(${groupId})</span></span>
        <span class="text-[var(--accent-teal)] text-xs">展開 / 收合 ▾</span>
      </summary>
      <div class="mt-4 flex justify-end">
        <button onclick="addQuestion('group_quiz', '${groupId}')" class="btn btn-teal">+ 新增專屬題</button>
      </div>
      <div id="group-list-${groupId}" class="space-y-4 mt-4"></div>
    `;
    wrap.appendChild(details);
    loadGroupQuiz(groupId);
  });
}

async function loadGroupQuiz(groupId){
  const snap = await db.ref(`questions/group_quiz/${groupId}`).get();
  renderQuestionList(`group-list-${groupId}`, snap.val() || {}, 'group_quiz', groupId);
}

async function loadCommonQuiz(){
  const snap = await db.ref('questions/common_quiz').get();
  renderQuestionList('common-list', snap.val() || {}, 'common_quiz', null);
}

// ==================================================
// 題目 卡片渲染（共用：專屬題 + 共同題）
// ==================================================
function questionRefPath(type, groupId, qId){
  return type === 'group_quiz'
    ? `questions/group_quiz/${groupId}/${qId}`
    : `questions/common_quiz/${qId}`;
}

function renderQuestionList(containerId, questionsObj, type, groupId){
  const container = document.getElementById(containerId);
  const ids = Object.keys(questionsObj);
  if (ids.length === 0){
    container.innerHTML = '<p class="text-sm text-[var(--text-dim)]">尚未有題目，按上方按鈕新增。</p>';
    return;
  }
  container.innerHTML = ids.map(qId => renderQuestionCard(qId, questionsObj[qId], type, groupId)).join('');
}

function renderQuestionCard(qId, q, type, groupId){
  const options = q.options || ['','','',''];
  const answer = typeof q.answer === 'number' ? q.answer : 0;
  const path = questionRefPath(type, groupId, qId);
  const letters = ['A','B','C','D'];
  return `
    <div class="qcard" id="qcard-${qId}">
      <label class="text-xs font-mono text-[var(--text-dim)]">題目</label>
      <textarea class="field mb-3" rows="2" id="q-text-${qId}">${escapeHtml(q.q || '')}</textarea>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
        ${letters.map((L,i) => `
          <div>
            <label class="text-xs font-mono text-[var(--text-dim)] flex items-center gap-2">
              <input type="radio" name="answer-${qId}" value="${i}" ${answer===i?'checked':''}>
              選項 ${L}（正確答案）
            </label>
            <input class="field mt-1" id="q-opt-${qId}-${i}" value="${escapeAttr(options[i]||'')}">
          </div>
        `).join('')}
      </div>
      <div class="flex gap-2 justify-end">
        <button onclick="deleteQuestion('${path}', '${qId}')" class="btn btn-danger-outline">刪除</button>
        <button onclick="saveQuestion('${qId}', '${path}')" class="btn btn-amber">儲存</button>
      </div>
    </div>`;
}

async function addQuestion(type, groupId){
  const path = type === 'group_quiz' ? `questions/group_quiz/${groupId}` : 'questions/common_quiz';
  const newRef = db.ref(path).push();
  await newRef.set({ q:'新題目，請編輯', options:['選項A','選項B','選項C','選項D'], answer:0 });
  if (type === 'group_quiz') loadGroupQuiz(groupId); else loadCommonQuiz();
}

async function saveQuestion(qId, path){
  const qText = document.getElementById(`q-text-${qId}`).value.trim();
  const options = [0,1,2,3].map(i => document.getElementById(`q-opt-${qId}-${i}`).value.trim());
  const radios = document.getElementsByName(`answer-${qId}`);
  let answer = 0;
  radios.forEach(r => { if (r.checked) answer = parseInt(r.value,10); });
  await db.ref(path).update({ q:qText, options, answer });
  alert('已儲存。');
}

async function deleteQuestion(path, qId){
  if (!confirm('確定刪除此題？')) return;
  await db.ref(path).remove();
  // 重新載入所屬列表
  if (path.includes('group_quiz')){
    const groupId = path.split('/')[2];
    loadGroupQuiz(groupId);
  } else {
    loadCommonQuiz();
  }
}

// ==================================================
// Bingo 句庫
// ==================================================
async function loadBingoPhrases(){
  const snap = await db.ref('bingo_phrases').get();
  const obj = snap.val() || {};
  const list = document.getElementById('bingo-list');
  const ids = Object.keys(obj);
  if (ids.length === 0){
    list.innerHTML = '<p class="text-sm text-[var(--text-dim)]">尚未有句子，按上方按鈕新增。</p>';
    return;
  }
  list.innerHTML = ids.map(id => `
    <div class="flex gap-2 items-center">
      <input class="field" id="bingo-${id}" value="${escapeAttr(obj[id])}">
      <button onclick="saveBingoPhrase('${id}')" class="btn btn-amber shrink-0">儲存</button>
      <button onclick="deleteBingoPhrase('${id}')" class="btn btn-danger-outline shrink-0">刪除</button>
    </div>
  `).join('');
}

async function addBingoPhrase(){
  const newRef = db.ref('bingo_phrases').push();
  await newRef.set('新句子，請編輯');
  loadBingoPhrases();
}
async function saveBingoPhrase(id){
  const val = document.getElementById(`bingo-${id}`).value.trim();
  await db.ref(`bingo_phrases/${id}`).set(val);
  alert('已儲存。');
}
async function deleteBingoPhrase(id){
  if (!confirm('確定刪除此句子？')) return;
  await db.ref(`bingo_phrases/${id}`).remove();
  loadBingoPhrases();
}

// ==================================================
// 線索（固定 3 Level x 3 條）
// ==================================================
async function loadClues(){
  const snap = await db.ref('clues').get();
  const data = snap.val() || {};
  const container = document.getElementById('clues-container');
  const levels = ['level1','level2','level3'];
  container.innerHTML = levels.map(level => {
    const items = data[level] || ['','',''];
    return `
      <div class="panel p-4">
        <h3 class="font-display font-semibold mb-3 text-[var(--accent-teal)]">${level.toUpperCase()}</h3>
        <div class="space-y-3">
          ${[0,1,2].map(i => `
            <div>
              <label class="text-xs font-mono text-[var(--text-dim)]">${level}_${i}</label>
              <input class="field mt-1" id="clue-${level}-${i}" value="${escapeAttr(items[i]||'')}" placeholder="文字內容，或以 http(s):// 開頭的圖片網址">
            </div>
          `).join('')}
        </div>
        <div class="flex justify-end mt-3">
          <button onclick="saveClueLevel('${level}')" class="btn btn-amber">儲存 ${level.toUpperCase()}</button>
        </div>
      </div>`;
  }).join('');
}

async function saveClueLevel(level){
  const values = [0,1,2].map(i => document.getElementById(`clue-${level}-${i}`).value.trim());
  await db.ref(`clues/${level}`).set(values);
  alert(`${level.toUpperCase()} 已儲存。`);
}
</script>
</body>
</html>
