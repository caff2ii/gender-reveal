<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Reveal — Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="config.js"></script></head><body class="min-h-screen bg-slate-950 p-8 text-stone-100"><main class="mx-auto max-w-xl"><p class="font-mono text-xs tracking-[.25em] text-cyan-300">RESTRICTED / ADMIN</p><div id="lock" class="mt-8"><input id="pass" type="password" class="w-full rounded bg-slate-800 p-3" placeholder="Password"><button class="mt-3 w-full rounded bg-cyan-400 p-3 font-bold text-slate-950" onclick="unlock()">UNLOCK</button></div><section id="panel" class="hidden mt-8"><h1 class="text-3xl font-black">Data controls</h1><p id="count" class="mt-3 text-slate-300"></p><button onclick="resetAll()" class="mt-6 rounded bg-red-500 px-4 py-3 font-bold">RESET PLAYERS + GAME STATE</button><p class="mt-3 text-xs text-slate-400">This deliberately keeps questions, bingo phrases, clues and secret gender.</p></section></main><script>function unlock(){if(document.querySelector('#pass').value!==GENDER_REVEAL_CONFIG.adminPassword)return alert('Incorrect password');document.querySelector('#lock').classList.add('hidden');document.querySelector('#panel').classList.remove('hidden');if(Game.init())Game.ref('players').on('value',s=>document.querySelector('#count').textContent=s.numChildren()+' registered players')}async function resetAll(){if(!confirm('Clear all players and the current game state?'))return;await Game.resetGame();alert('Game reset. Reference content was preserved.')}window.unlock=unlock;window.resetAll=resetAll;</script></body></html>
