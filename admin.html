<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Reveal Party - Admin</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    
    <!-- Firebase -->
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-app-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-database-compat.js"></script>
    
    <!-- Config -->
    <script src="config.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background-color: #0d0d0d;
            color: #f8f8f8;
            min-height: 100vh;
        }
        
        .font-mono {
            font-family: 'IBM Plex Mono', monospace;
        }
        
        /* Admin dashboard styling */
        .admin-dashboard {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            min-height: 100vh;
        }
        
        .admin-card {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid #334155;
            backdrop-filter: blur(10px);
        }
        
        /* Navigation tabs */
        .nav-tab {
            background: #1a1a1a;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .nav-tab:hover {
            background: #334155;
            color: #f8f8f8;
        }
        
        .nav-tab.active {
            background: #f97316;
            border-color: #f97316;
            color: #0d0d0d;
        }
        
        /* Form styling */
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.875rem;
            color: #94a3b8;
        }
        
        .form-input {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #334155;
            color: #f8f8f8;
            padding: 0.75rem;
            border-radius: 4px;
            transition: border-color 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #f97316;
        }
        
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }
        
        .btn-primary {
            background: #f97316;
            color: #0d0d0d;
        }
        
        .btn-primary:hover {
            background: #ea580c;
        }
        
        .btn-secondary {
            background: #334155;
            color: #f8f8f8;
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        .btn-danger {
            background: #ef4444;
            color: #f8f8f8;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
        
        /* Question list styling */
        .question-item {
            background: rgba(26, 26, 26, 0.6);
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        
        .question-item:hover {
            border-color: #475569;
        }
        
        /* Password gate styling */
        .password-gate {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
        }
        
        .password-card {
            background: rgba(26, 26, 26, 0.9);
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #334155;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Content panels */
        .content-panel {
            display: none;
        }
        
        .content-panel.active {
            display: block;
        }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: #1a1a1a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        /* Status indicator */
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-indicator.online {
            background: #22c55e;
        }
        
        .status-indicator.offline {
            background: #ef4444;
        }
        
        /* Option input styling */
        .option-input {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        .option-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.875rem;
            color: #94a3b8;
            width: 24px;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
        </div>
        
        <!-- Password Gate -->
        <div id="password-gate" class="password-gate hidden">
            <div class="password-card">
                <h1 class="text-2xl font-bold mb-6 text-center">ADMIN ACCESS</h1>
                <div class="form-group">
                    <label class="form-label">PASSWORD</label>
                    <input type="password" id="password-input" class="form-input" placeholder="Enter password">
                </div>
                <button id="login-btn" class="btn btn-primary w-full">ACCESS</button>
                <p id="password-error" class="text-red-500 text-sm mt-4 text-center hidden">Incorrect password</p>
            </div>
        </div>
        
        <!-- Main Admin Dashboard -->
        <div id="main-content" class="hidden admin-dashboard">
            <div class="container mx-auto px-4 py-8">
                <!-- Header -->
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h1 class="text-3xl font-bold mb-2">ADMIN DASHBOARD</h1>
                        <p class="text-gray-400 font-mono text-sm">CONTENT MANAGEMENT SYSTEM</p>
                    </div>
                    <div class="flex items-center">
                        <span id="connection-status" class="status-indicator online"></span>
                        <span id="connection-text" class="text-sm text-gray-400">Connected</span>
                    </div>
                </div>
                
                <!-- Navigation Tabs -->
                <div class="flex gap-2 mb-8 flex-wrap">
                    <button class="nav-tab active" data-panel="group-quiz">GROUP QUIZ</button>
                    <button class="nav-tab" data-panel="common-quiz">COMMON QUIZ</button>
                    <button class="nav-tab" data-panel="bingo">BINGO PHRASES</button>
                    <button class="nav-tab" data-panel="clues">CLUES</button>
                </div>
                
                <!-- Group Quiz Panel -->
                <div id="group-quiz-panel" class="content-panel active">
                    <div class="admin-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold">GROUP QUIZ MANAGEMENT</h2>
                            <select id="group-select" class="form-input w-48">
                                <option value="group_ccbc">CCBC</option>
                                <option value="group_hiking">偽E真I行山團</option>
                                <option value="group_southdinner">南區食飯</option>
                                <option value="group_fridaydinner">FRIDAY DINNER</option>
                                <option value="group_boardgame">東區桌遊美食</option>
                                <option value="group_agewell">Uniting Agewell</option>
                                <option value="group_prayer">Praise and Pray</option>
                            </select>
                        </div>
                        
                        <div id="group-quiz-list" class="mb-6">
                            <!-- Questions will be loaded here -->
                        </div>
                        
                        <button id="add-group-question-btn" class="btn btn-primary">+ ADD QUESTION</button>
                    </div>
                </div>
                
                <!-- Common Quiz Panel -->
                <div id="common-quiz-panel" class="content-panel">
                    <div class="admin-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold">COMMON QUIZ MANAGEMENT</h2>
                        </div>
                        
                        <div id="common-quiz-list" class="mb-6">
                            <!-- Questions will be loaded here -->
                        </div>
                        
                        <button id="add-common-question-btn" class="btn btn-primary">+ ADD QUESTION</button>
                    </div>
                </div>
                
                <!-- Bingo Phrases Panel -->
                <div id="bingo-panel" class="content-panel">
                    <div class="admin-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold">BINGO PHRASES MANAGEMENT</h2>
                        </div>
                        
                        <div id="bingo-phrases-list" class="mb-6">
                            <!-- Phrases will be loaded here -->
                        </div>
                        
                        <button id="add-bingo-phrase-btn" class="btn btn-primary">+ ADD PHRASE</button>
                    </div>
                </div>
                
                <!-- Clues Panel -->
                <div id="clues-panel" class="content-panel">
                    <div class="admin-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold">CLUES MANAGEMENT</h2>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <!-- Level 1 Clues -->
                            <div>
                                <h3 class="font-bold mb-4 text-orange-500">LEVEL 1 CLUES</h3>
                                <div id="level1-clues-list" class="mb-4">
                                    <!-- Clues will be loaded here -->
                                </div>
                            </div>
                            
                            <!-- Level 2 Clues -->
                            <div>
                                <h3 class="font-bold mb-4 text-amber-500">LEVEL 2 CLUES</h3>
                                <div id="level2-clues-list" class="mb-4">
                                    <!-- Clues will be loaded here -->
                                </div>
                            </div>
                            
                            <!-- Level 3 Clues -->
                            <div>
                                <h3 class="font-bold mb-4 text-red-500">LEVEL 3 CLUES</h3>
                                <div id="level3-clues-list" class="mb-4">
                                    <!-- Clues will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Question Modal -->
        <div id="question-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="question-modal-title" class="text-xl font-bold mb-6">ADD QUESTION</h2>
                <div class="form-group">
                    <label class="form-label">QUESTION</label>
                    <textarea id="question-text" class="form-input form-textarea"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">OPTIONS</label>
                    <div id="options-container">
                        <div class="option-input">
                            <span class="option-label">A</span>
                            <input type="text" class="form-input option-a" data-index="0">
                        </div>
                        <div class="option-input">
                            <span class="option-label">B</span>
                            <input type="text" class="form-input option-b" data-index="1">
                        </div>
                        <div class="option-input">
                            <span class="option-label">C</span>
                            <input type="text" class="form-input option-c" data-index="2">
                        </div>
                        <div class="option-input">
                            <span class="option-label">D</span>
                            <input type="text" class="form-input option-d" data-index="3">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">CORRECT ANSWER</label>
                    <select id="correct-answer" class="form-input">
                        <option value="0">A</option>
                        <option value="1">B</option>
                        <option value="2">C</option>
                        <option value="3">D</option>
                    </select>
                </div>
                <div class="flex gap-4 mt-6">
                    <button id="save-question-btn" class="btn btn-primary flex-1">SAVE</button>
                    <button id="cancel-question-btn" class="btn btn-secondary flex-1">CANCEL</button>
                </div>
            </div>
        </div>
        
        <!-- Bingo Phrase Modal -->
        <div id="bingo-modal" class="modal hidden">
            <div class="modal-content">
                <h2 class="text-xl font-bold mb-6">ADD BINGO PHRASE</h2>
                <div class="form-group">
                    <label class="form-label">PHRASE</label>
                    <input type="text" id="bingo-phrase-text" class="form-input">
                </div>
                <div class="flex gap-4 mt-6">
                    <button id="save-bingo-btn" class="btn btn-primary flex-1">SAVE</button>
                    <button id="cancel-bingo-btn" class="btn btn-secondary flex-1">CANCEL</button>
                </div>
            </div>
        </div>
        
        <!-- Clue Modal -->
        <div id="clue-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="clue-modal-title" class="text-xl font-bold mb-6">ADD CLUE</h2>
                <div class="form-group">
                    <label class="form-label">CLUE TYPE</label>
                    <select id="clue-type" class="form-input">
                        <option value="text">TEXT</option>
                        <option value="image">IMAGE URL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">CONTENT</label>
                    <textarea id="clue-content" class="form-input form-textarea"></textarea>
                </div>
                <div class="flex gap-4 mt-6">
                    <button id="save-clue-btn" class="btn btn-primary flex-1">SAVE</button>
                    <button id="cancel-clue-btn" class="btn btn-secondary flex-1">CANCEL</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Firebase initialization with error handling
        let database;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(window.CONFIG.firebaseConfig);
            }
            database = firebase.database();
        } catch (error) {
            console.error('Firebase initialization error:', error);
            alert('Firebase initialization failed. Please check your internet connection.');
        }
        
        // State
        let isAuthenticated = false;
        let currentPanel = 'group-quiz';
        let currentGroup = 'group_ccbc';
        let editingQuestion = null;
        let editingBingoPhrase = null;
        let editingClue = null;
        
        // DOM Elements
        const loadingEl = document.getElementById('loading');
        const passwordGateEl = document.getElementById('password-gate');
        const mainContentEl = document.getElementById('main-content');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const passwordError = document.getElementById('password-error');
        const connectionStatus = document.getElementById('connection-status');
        const connectionText = document.getElementById('connection-text');
        const groupSelect = document.getElementById('group-select');
        
        // Modal elements
        const questionModal = document.getElementById('question-modal');
        const questionModalTitle = document.getElementById('question-modal-title');
        const questionText = document.getElementById('question-text');
        const optionA = document.querySelector('.option-a');
        const optionB = document.querySelector('.option-b');
        const optionC = document.querySelector('.option-c');
        const optionD = document.querySelector('.option-d');
        const correctAnswer = document.getElementById('correct-answer');
        const saveQuestionBtn = document.getElementById('save-question-btn');
        const cancelQuestionBtn = document.getElementById('cancel-question-btn');
        
        const bingoModal = document.getElementById('bingo-modal');
        const bingoPhraseText = document.getElementById('bingo-phrase-text');
        const saveBingoBtn = document.getElementById('save-bingo-btn');
        const cancelBingoBtn = document.getElementById('cancel-bingo-btn');
        
        const clueModal = document.getElementById('clue-modal');
        const clueModalTitle = document.getElementById('clue-modal-title');
        const clueType = document.getElementById('clue-type');
        const clueContent = document.getElementById('clue-content');
        const saveClueBtn = document.getElementById('save-clue-btn');
        const cancelClueBtn = document.getElementById('cancel-clue-btn');
        
        // Initialize
        function init() {
            console.log('Admin initialization starting...');
            
            // Check localStorage for auth state
            const savedAuth = localStorage.getItem('adminAuth');
            if (savedAuth === 'true') {
                isAuthenticated = true;
                showMainContent();
            } else {
                showPasswordGate();
            }
            
            // Setup connection monitoring
            setupConnectionMonitoring();
            
            // Setup navigation
            setupNavigation();
            
            // Load initial data
            if (isAuthenticated) {
                loadGroupQuiz();
                // Setup clue buttons after initial load
                setTimeout(setupClueButtons, 100);
            }
            
            console.log('Admin initialization complete');
        }
        
        function showPasswordGate() {
            console.log('Showing password gate');
            loadingEl.classList.add('hidden');
            passwordGateEl.classList.remove('hidden');
            mainContentEl.classList.add('hidden');
        }
        
        function showMainContent() {
            console.log('Showing main content');
            loadingEl.classList.add('hidden');
            passwordGateEl.classList.add('hidden');
            mainContentEl.classList.remove('hidden');
        }
        
        function setupConnectionMonitoring() {
            const connectedRef = database.ref('.info/connected');
            connectedRef.on('value', (snapshot) => {
                const connected = snapshot.val();
                if (connected) {
                    connectionStatus.classList.remove('offline');
                    connectionStatus.classList.add('online');
                    connectionText.textContent = 'Connected';
                } else {
                    connectionStatus.classList.remove('online');
                    connectionStatus.classList.add('offline');
                    connectionText.textContent = 'Disconnected';
                }
            });
        }
        
        function setupNavigation() {
            const navTabs = document.querySelectorAll('.nav-tab');
            navTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const panel = tab.dataset.panel;
                    switchPanel(panel);
                });
            });
        }
        
        function switchPanel(panel) {
            currentPanel = panel;
            
            // Update tab styles
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.panel === panel) {
                    tab.classList.add('active');
                }
            });
            
            // Show corresponding panel
            document.querySelectorAll('.content-panel').forEach(p => {
                p.classList.remove('active');
            });
            document.getElementById(`${panel}-panel`).classList.add('active');
            
            // Load data for the panel
            switch(panel) {
                case 'group-quiz':
                    loadGroupQuiz();
                    break;
                case 'common-quiz':
                    loadCommonQuiz();
                    break;
                case 'bingo':
                    loadBingoPhrases();
                    break;
                case 'clues':
                    loadClues();
                    setupClueButtons();
                    break;
            }
        }
        
        // Group Quiz Functions
        function loadGroupQuiz() {
            const group = groupSelect.value;
            database.ref(`questions/group_quiz/${group}`).on('value', (snapshot) => {
                const questions = snapshot.val() || {};
                displayGroupQuiz(questions);
            });
        }
        
        function displayGroupQuiz(questions) {
            const container = document.getElementById('group-quiz-list');
            container.innerHTML = '';
            
            const questionArray = Object.keys(questions).map(key => ({
                id: key,
                ...questions[key]
            }));
            
            if (questionArray.length === 0) {
                container.innerHTML = '<p class="text-gray-400">No questions yet. Add your first question!</p>';
                return;
            }
            
            questionArray.forEach((q, index) => {
                const div = document.createElement('div');
                div.className = 'question-item';
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-mono text-sm text-gray-400">Q${index + 1}</span>
                        <div class="flex gap-2">
                            <button class="btn btn-sm btn-secondary edit-question" data-id="${q.id}">Edit</button>
                            <button class="btn btn-sm btn-danger delete-question" data-id="${q.id}">Delete</button>
                        </div>
                    </div>
                    <div class="font-semibold mb-2">${window.GenderRevealUtils.escapeHtml(q.q)}</div>
                    <div class="text-sm text-gray-400">
                        A: ${window.GenderRevealUtils.escapeHtml(q.options[0])} | 
                        B: ${window.GenderRevealUtils.escapeHtml(q.options[1])} | 
                        C: ${window.GenderRevealUtils.escapeHtml(q.options[2])} | 
                        D: ${window.GenderRevealUtils.escapeHtml(q.options[3])}
                    </div>
                    <div class="text-xs text-orange-500 mt-1">Answer: ${['A', 'B', 'C', 'D'][q.answer]}</div>
                `;
                container.appendChild(div);
            });
            
            // Add event listeners
            container.querySelectorAll('.edit-question').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    editGroupQuestion(id);
                });
            });
            
            container.querySelectorAll('.delete-question').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    deleteGroupQuestion(id);
                });
            });
        }
        
        function editGroupQuestion(id) {
            const group = groupSelect.value;
            database.ref(`questions/group_quiz/${group}/${id}`).once('value', (snapshot) => {
                const question = snapshot.val();
                editingQuestion = { id, group, type: 'group' };
                
                questionModalTitle.textContent = 'EDIT QUESTION';
                questionText.value = question.q;
                optionA.value = question.options[0];
                optionB.value = question.options[1];
                optionC.value = question.options[2];
                optionD.value = question.options[3];
                correctAnswer.value = question.answer;
                
                questionModal.classList.remove('hidden');
            });
        }
        
        function deleteGroupQuestion(id) {
            if (confirm('Are you sure you want to delete this question?')) {
                const group = groupSelect.value;
                database.ref(`questions/group_quiz/${group}/${id}`).remove();
            }
        }
        
        // Common Quiz Functions
        function loadCommonQuiz() {
            database.ref('questions/common_quiz').on('value', (snapshot) => {
                const questions = snapshot.val() || {};
                displayCommonQuiz(questions);
            });
        }
        
        function displayCommonQuiz(questions) {
            const container = document.getElementById('common-quiz-list');
            container.innerHTML = '';
            
            const questionArray = Object.keys(questions).map(key => ({
                id: key,
                ...questions[key]
            }));
            
            if (questionArray.length === 0) {
                container.innerHTML = '<p class="text-gray-400">No questions yet. Add your first question!</p>';
                return;
            }
            
            questionArray.forEach((q, index) => {
                const div = document.createElement('div');
                div.className = 'question-item';
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-mono text-sm text-gray-400">Q${index + 1}</span>
                        <div class="flex gap-2">
                            <button class="btn btn-sm btn-secondary edit-common-question" data-id="${q.id}">Edit</button>
                            <button class="btn btn-sm btn-danger delete-common-question" data-id="${q.id}">Delete</button>
                        </div>
                    </div>
                    <div class="font-semibold mb-2">${window.GenderRevealUtils.escapeHtml(q.q)}</div>
                    <div class="text-sm text-gray-400">
                        A: ${window.GenderRevealUtils.escapeHtml(q.options[0])} | 
                        B: ${window.GenderRevealUtils.escapeHtml(q.options[1])} | 
                        C: ${window.GenderRevealUtils.escapeHtml(q.options[2])} | 
                        D: ${window.GenderRevealUtils.escapeHtml(q.options[3])}
                    </div>
                    <div class="text-xs text-orange-500 mt-1">Answer: ${['A', 'B', 'C', 'D'][q.answer]}</div>
                `;
                container.appendChild(div);
            });
            
            // Add event listeners
            container.querySelectorAll('.edit-common-question').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    editCommonQuestion(id);
                });
            });
            
            container.querySelectorAll('.delete-common-question').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    deleteCommonQuestion(id);
                });
            });
        }
        
        function editCommonQuestion(id) {
            database.ref(`questions/common_quiz/${id}`).once('value', (snapshot) => {
                const question = snapshot.val();
                editingQuestion = { id, type: 'common' };
                
                questionModalTitle.textContent = 'EDIT QUESTION';
                questionText.value = question.q;
                optionA.value = question.options[0];
                optionB.value = question.options[1];
                optionC.value = question.options[2];
                optionD.value = question.options[3];
                correctAnswer.value = question.answer;
                
                questionModal.classList.remove('hidden');
            });
        }
        
        function deleteCommonQuestion(id) {
            if (confirm('Are you sure you want to delete this question?')) {
                database.ref(`questions/common_quiz/${id}`).remove();
            }
        }
        
        // Bingo Phrases Functions
        function loadBingoPhrases() {
            database.ref('bingo_phrases').on('value', (snapshot) => {
                const phrases = snapshot.val() || {};
                displayBingoPhrases(phrases);
            });
        }
        
        function displayBingoPhrases(phrases) {
            const container = document.getElementById('bingo-phrases-list');
            container.innerHTML = '';
            
            const phraseArray = Object.keys(phrases).map(key => ({
                id: key,
                text: phrases[key]
            }));
            
            if (phraseArray.length === 0) {
                container.innerHTML = '<p class="text-gray-400">No phrases yet. Add your first phrase!</p>';
                return;
            }
            
            phraseArray.forEach((phrase, index) => {
                const div = document.createElement('div');
                div.className = 'question-item';
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-mono text-sm text-gray-400 mr-4">#${index + 1}</span>
                        <span class="flex-1">${window.GenderRevealUtils.escapeHtml(phrase.text)}</span>
                        <div class="flex gap-2 ml-4">
                            <button class="btn btn-sm btn-secondary edit-bingo" data-id="${phrase.id}">Edit</button>
                            <button class="btn btn-sm btn-danger delete-bingo" data-id="${phrase.id}">Delete</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
            
            // Add event listeners
            container.querySelectorAll('.edit-bingo').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    editBingoPhrase(id);
                });
            });
            
            container.querySelectorAll('.delete-bingo').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    deleteBingoPhrase(id);
                });
            });
        }
        
        function editBingoPhrase(id) {
            database.ref(`bingo_phrases/${id}`).once('value', (snapshot) => {
                const text = snapshot.val();
                editingBingoPhrase = id;
                
                bingoPhraseText.value = text;
                bingoModal.classList.remove('hidden');
            });
        }
        
        function deleteBingoPhrase(id) {
            if (confirm('Are you sure you want to delete this phrase?')) {
                database.ref(`bingo_phrases/${id}`).remove();
            }
        }
        
        // Clues Functions
        function loadClues() {
            database.ref('clues').on('value', (snapshot) => {
                const clues = snapshot.val() || { level1: [], level2: [], level3: [] };
                displayClues(clues);
            });
        }
        
        function displayClues(clues) {
            ['level1', 'level2', 'level3'].forEach(level => {
                const container = document.getElementById(`${level}-clues-list`);
                container.innerHTML = '';
                
                const levelClues = clues[level] || [];
                
                if (levelClues.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-sm">No clues yet</p>';
                    return;
                }
                
                levelClues.forEach((clue, index) => {
                    const div = document.createElement('div');
                    div.className = 'question-item p-2';
                    const isImage = clue.startsWith('http');
                    div.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-mono text-xs text-gray-400 mr-2">#${index + 1}</span>
                            <span class="flex-1 text-sm truncate">
                                ${isImage ? '🖼️ Image' : window.GenderRevealUtils.escapeHtml(clue)}
                            </span>
                            <div class="flex gap-2 ml-4">
                                <button class="btn btn-sm btn-secondary edit-clue" data-level="${level}" data-index="${index}">Edit</button>
                                <button class="btn btn-sm btn-danger delete-clue" data-level="${level}" data-index="${index}">×</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
            
            // Add event listeners for edit and delete buttons
            document.querySelectorAll('.edit-clue').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const level = e.target.dataset.level;
                    const index = parseInt(e.target.dataset.index);
                    editClue(level, index);
                });
            });
            
            document.querySelectorAll('.delete-clue').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const level = e.target.dataset.level;
                    const index = parseInt(e.target.dataset.index);
                    deleteClue(level, index);
                });
            });
        }
        
        function deleteClue(level, index) {
            if (confirm('Are you sure you want to delete this clue?')) {
                database.ref(`clues/${level}`).once('value', (snapshot) => {
                    const clues = snapshot.val() || [];
                    clues.splice(index, 1);
                    database.ref(`clues/${level}`).set(clues);
                });
            }
        }
        
        function editClue(level, index) {
            database.ref(`clues/${level}`).once('value', (snapshot) => {
                const clues = snapshot.val() || [];
                const clue = clues[index];
                const isImage = clue.startsWith('http');
                
                editingClue = { level, index };
                clueModalTitle.textContent = `EDIT ${level.toUpperCase()} CLUE`;
                clueType.value = isImage ? 'image' : 'text';
                clueContent.value = clue;
                clueModal.classList.remove('hidden');
            });
        }
        
        // Event Listeners
        loginBtn.addEventListener('click', () => {
            const password = passwordInput.value;
            if (password === window.CONFIG.adminPassword) {
                isAuthenticated = true;
                localStorage.setItem('adminAuth', 'true');
                showMainContent();
                loadGroupQuiz();
            } else {
                passwordError.classList.remove('hidden');
                passwordInput.value = '';
            }
        });
        
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });
        
        groupSelect.addEventListener('change', () => {
            currentGroup = groupSelect.value;
            loadGroupQuiz();
        });
        
        // Add question buttons
        document.getElementById('add-group-question-btn').addEventListener('click', () => {
            editingQuestion = { type: 'group', group: groupSelect.value };
            questionModalTitle.textContent = 'ADD QUESTION';
            questionText.value = '';
            optionA.value = '';
            optionB.value = '';
            optionC.value = '';
            optionD.value = '';
            correctAnswer.value = '0';
            questionModal.classList.remove('hidden');
        });
        
        document.getElementById('add-common-question-btn').addEventListener('click', () => {
            editingQuestion = { type: 'common' };
            questionModalTitle.textContent = 'ADD QUESTION';
            questionText.value = '';
            optionA.value = '';
            optionB.value = '';
            optionC.value = '';
            optionD.value = '';
            correctAnswer.value = '0';
            questionModal.classList.remove('hidden');
        });
        
        // Question modal buttons
        saveQuestionBtn.addEventListener('click', () => {
            const questionData = {
                q: questionText.value,
                options: [optionA.value, optionB.value, optionC.value, optionD.value],
                answer: parseInt(correctAnswer.value)
            };
            
            if (!questionData.q || questionData.options.some(o => !o)) {
                alert('Please fill in all fields');
                return;
            }
            
            if (editingQuestion.type === 'group') {
                const group = editingQuestion.group;
                if (editingQuestion.id) {
                    // Edit existing
                    database.ref(`questions/group_quiz/${group}/${editingQuestion.id}`).update(questionData);
                } else {
                    // Add new
                    database.ref(`questions/group_quiz/${group}`).push(questionData);
                }
            } else {
                if (editingQuestion.id) {
                    // Edit existing
                    database.ref(`questions/common_quiz/${editingQuestion.id}`).update(questionData);
                } else {
                    // Add new
                    database.ref(`questions/common_quiz`).push(questionData);
                }
            }
            
            questionModal.classList.add('hidden');
            editingQuestion = null;
        });
        
        cancelQuestionBtn.addEventListener('click', () => {
            questionModal.classList.add('hidden');
            editingQuestion = null;
        });
        
        // Bingo phrase buttons
        document.getElementById('add-bingo-phrase-btn').addEventListener('click', () => {
            editingBingoPhrase = null;
            bingoPhraseText.value = '';
            bingoModal.classList.remove('hidden');
        });
        
        saveBingoBtn.addEventListener('click', () => {
            const text = bingoPhraseText.value;
            if (!text) {
                alert('Please enter a phrase');
                return;
            }
            
            if (editingBingoPhrase) {
                database.ref(`bingo_phrases/${editingBingoPhrase}`).set(text);
            } else {
                database.ref('bingo_phrases').push(text);
            }
            
            bingoModal.classList.add('hidden');
            editingBingoPhrase = null;
        });
        
        cancelBingoBtn.addEventListener('click', () => {
            bingoModal.classList.add('hidden');
            editingBingoPhrase = null;
        });
        
        // Clue buttons - setup after DOM is loaded
        function setupClueButtons() {
            document.querySelectorAll('#clues-panel h3').forEach((heading, index) => {
                // Remove existing button if any
                const existingBtn = heading.parentNode.querySelector('.add-clue-btn');
                if (existingBtn) {
                    existingBtn.remove();
                }
                
                const level = ['level1', 'level2', 'level3'][index];
                const addBtn = document.createElement('button');
                addBtn.className = 'btn btn-sm btn-primary mt-2 add-clue-btn';
                addBtn.textContent = '+ ADD CLUE';
                addBtn.addEventListener('click', () => {
                    editingClue = { level, index: null };
                    clueModalTitle.textContent = `ADD ${level.toUpperCase()} CLUE`;
                    clueType.value = 'text';
                    clueContent.value = '';
                    clueModal.classList.remove('hidden');
                });
                heading.parentNode.appendChild(addBtn);
            });
        }
        
        saveClueBtn.addEventListener('click', () => {
            const type = clueType.value;
            const content = clueContent.value;
            
            if (!content) {
                alert('Please enter clue content');
                return;
            }
            
            const clueData = type === 'image' ? content.trim() : content.trim();
            
            database.ref(`clues/${editingClue.level}`).once('value', (snapshot) => {
                const clues = snapshot.val() || [];
                
                if (editingClue.index !== null) {
                    // Edit existing
                    clues[editingClue.index] = clueData;
                } else {
                    // Add new
                    if (clues.length >= 3) {
                        alert('Maximum 3 clues per level');
                        return;
                    }
                    clues.push(clueData);
                }
                
                database.ref(`clues/${editingClue.level}`).set(clues);
                clueModal.classList.add('hidden');
                editingClue = null;
            });
        });
        
        cancelClueBtn.addEventListener('click', () => {
            clueModal.classList.add('hidden');
            editingClue = null;
        });
        
        // Start initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Global error handler
        window.addEventListener('error', (e) => {
            console.error('Global error:', e.error);
        });
    </script>
</body>
</html>
