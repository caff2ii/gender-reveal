<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Reveal — Display</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script><script src="config.js"></script></head><body class="min-h-screen overflow-hidden bg-[#10151d] text-[#f7f2ea]"><main class="grid min-h-screen place-items-center p-12 text-center"><div><p class="font-mono tracking-[.5em] text-cyan-300">CLASSIFIED / LIVE DISPLAY</p><h1 id="phase" class="mt-8 text-7xl font-black tracking-tight"></h1><p id="sub" class="mt-6 text-2xl text-slate-300"></p></div></main><script>if(Game.init()){Game.ensureState();Game.stateRef.on('value',s=>{s=s.val()||{};let p=(s.current_phase||'ONBOARDING').replaceAll('_',' ');document.querySelector('#phase').textContent=p;document.querySelector('#sub').textContent=s.current_bingo_phrase?'EVIDENCE DRAWN: '+s.current_bingo_phrase:'Follow the host’s instructions';if(s.current_phase==='GRAND_REVEAL'&&s.revealed_gender){document.body.className='min-h-screen overflow-hidden '+(s.revealed_gender==='boy'?'bg-blue-600':'bg-pink-600')+' text-white';confetti({particleCount:250,spread:140});}})}</script></body></html>
