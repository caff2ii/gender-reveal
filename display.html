<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Reveal — Display</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script><script src="config.js"></script></head><body class="min-h-screen overflow-hidden bg-[#10151d] text-[#f7f2ea]"><main class="grid min-h-screen place-items-center p-12 text-center"><div><p id="tag" class="font-mono tracking-[.5em] text-cyan-300">CLASSIFIED / LIVE DISPLAY</p><h1 id="phase" class="mt-8 text-7xl font-black tracking-tight"></h1><p id="sub" class="mt-6 text-2xl text-slate-300"></p><div id="stats" class="mt-8 text-lg"></div></div></main><script>
let latest={},didPop=false;function set(p,sub,stats=''){document.querySelector('#phase').textContent=p;document.querySelector('#sub').textContent=sub;document.querySelector('#stats').innerHTML=stats}async function render(s){latest=s;let p=(s.current_phase||'ONBOARDING').replaceAll('_',' '),sub='Follow the host’s instructions';if(s.current_phase==='GRAND_REVEAL'){let left=Math.max(0,Math.ceil(((s.reveal_countdown_ends_at||0)-Date.now())/1000));if(left){document.body.className='min-h-screen overflow-hidden bg-[#10151d] text-[#f7f2ea]';set(String(left),'THE FINAL EVIDENCE IS ABOUT TO BE UNSEALED');return}let gender=s.revealed_gender==='boy'?'BOY':'GIRL',color=s.revealed_gender==='boy'?'bg-blue-600':'bg-pink-600',x=s.reveal_stats||{};document.body.className='min-h-screen overflow-hidden '+color+' text-white';document.querySelector('#tag').textContent='CASE CLOSED / THE REVEAL';set("IT'S A "+gender,'',x.submitted?'<b>'+x.correct+'/'+x.submitted+'</b> guessed correctly · '+x.percent+'%<br><span class="text-sm">'+(x.names||[]).join(' · ')+'</span>':'No final predictions submitted');if(!didPop){didPop=true;confetti({particleCount:300,spread:150,origin:{y:.55}})}return}didPop=false;if(s.current_phase==='GAME1_QUIZ'){if(s.game1_mode==='group'){p='GROUP CASE '+((s.current_question_index||0)+1);sub='Each group is receiving its own evidence question.'}else{p='COMMON CASE '+((s.current_question_index||0)+1);let q=Game.normalizeCollection((await Game.ref('common_quiz').once('value')).val())[s.current_question_index||0];sub=q?Game.questionText(q):sub}if(s.current_question_index===4&&s.game1_mode==='common')sub+=' · FINAL 15-SECOND RUSH'}if(s.current_bingo_phrase){p='EVIDENCE DRAWN';sub=s.current_bingo_phrase}set(p,sub)}if(Game.init()){Game.ensureState();Game.stateRef.on('value',s=>render(s.val()||{}));setInterval(()=>{if(latest.current_phase==='GRAND_REVEAL')render(latest)},200)}
</script><script>
function settlement(s){if(s.current_phase==='GAME1_SETTLE'){let l=(s.game1_leaderboard||[]).slice(0,10);set('CASE 01 · RESULTS','Top investigators',l.map(x=>'<div class="mx-auto flex max-w-xl justify-between border-b border-slate-600 py-1"><b>#'+x.rank+' '+x.name+'</b><span>'+x.score+' pts</span></div>').join(''));}if(s.current_phase==='GAME2_SETTLE'){let l=(s.game2_finishers||[]);set('EVIDENCE BOARD · RESULTS',l.length?l.length+' investigators completed two lines':'No two-line finishers',l.slice(0,10).map(x=>'<div>#'+x.place+' · '+x.name+'</div>').join(''));}}if(Game.init())Game.stateRef.on('value',x=>settlement(x.val()||{}));
</script></body></html>
