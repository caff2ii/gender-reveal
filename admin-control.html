<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性別揭曉派對 - 現場控制</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        .control-dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 640px;
            margin: 0 auto;
        }
        
        .dashboard-card {
            background: rgba(255,255,255,0.08);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
        }
        
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 15px;
            text-align: center;
        }
        
        .step-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .step-btn {
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #555;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .step-btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        
        .step-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        
        .vote-bar {
            display: flex;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            margin: 15px 0;
            border: 2px solid #fff;
        }
        
        .vote-boy {
            background: var(--boy-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex: 1;
            transition: flex 0.3s;
        }
        
        .vote-girl {
            background: var(--girl-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex: 1;
            transition: flex 0.3s;
        }
        
        .leaderboard {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #555;
            font-size: 0.95rem;
        }
        
        .leaderboard-item:last-child {
            border-bottom: none;
        }
        
        .leaderboard-rank {
            font-weight: bold;
            color: var(--accent);
            min-width: 30px;
        }
        
        .leaderboard-name {
            flex: 1;
            margin-left: 10px;
        }
        
        .leaderboard-score {
            font-weight: bold;
            color: #4CAF50;
        }
        
        .score-editor {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .score-editor input,
        .score-editor select {
            flex: 1;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        .score-editor button {
            padding: 8px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .score-editor button:hover {
            background: #45a049;
        }
        
        .reveal-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #ff6b6b, #f5a623);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .reveal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,107,107,0.5);
        }
        
        .gender-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .gender-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #555;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .gender-btn.boy {
            border-color: var(--boy-color);
        }
        
        .gender-btn.boy.active {
            background: var(--boy-color);
            color: #000;
        }
        
        .gender-btn.girl {
            border-color: var(--girl-color);
        }
        
        .gender-btn.girl.active {
            background: var(--girl-color);
            color: #000;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="control-dashboard">
        <!-- Left Column: Stage Control & Settings -->
        <div>
            <div class="dashboard-card">
                <div class="card-title">🎬 現場關卡控制</div>
                <div class="step-grid">
                    <button class="step-btn" data-step="LOGIN">1️⃣ 登入</button>
                    <button class="step-btn" data-step="GAME1">2️⃣ Game 1</button>
                    <button class="step-btn" data-step="GAME2">3️⃣ Game 2</button>
                    <button class="step-btn" data-step="GAME3">4️⃣ Game 3</button>
                </div>
                <div style="text-align: center; opacity: 0.8;">
                    當前階段: <strong id="current-step-display" style="color: var(--accent);">載入中...</strong>
                </div>
            </div>

            <!-- Gender Setting Status -->
            <div class="dashboard-card" style="margin-top: 20px;">
                <div class="card-title">👶 最終性別狀態</div>
                <div style="text-align: center; opacity: 0.8; margin-bottom: 10px;">
                    設定狀態: <strong id="current-gender-display" style="color: var(--accent);">載入中...</strong>
                </div>
                <p style="font-size: 0.8rem; opacity: 0.6; text-align: center;">
                    🔒 為保持驚喜，最終性別由知情人喺獨立頁面設定（gender-setting.html，密碼另附）
                </p>
            </div>

            <!-- Testing Reset -->
            <div class="dashboard-card" style="margin-top: 20px;">
                <div class="card-title">🔄 測試重置</div>
                <p style="font-size: 0.8rem; opacity: 0.6; text-align: center; margin-bottom: 10px;">
                    清除玩家數據、分數、投票並返回登入階段；題目、線索會保留（測試用）
                </p>
                <button id="btn-reset-testing" style="width:100%; padding:15px; background:#f44336; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                    🔄 重置所有遊戲數據
                </button>
            </div>
        </div>
    </div>

    <!-- Master Reveal Button (Full Width) -->
    <button class="reveal-btn" id="btn-trigger-reveal">🔥 觸發最終 10 秒倒數 REVEAL</button>

    <script type="module" src="js/admin-control.js?v=20250825"></script>
</body>
</html>
