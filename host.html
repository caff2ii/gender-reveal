<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Reveal — Host</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="config.js"></script></head><body class="bg-slate-950 text-stone-100"><main class="mx-auto max-w-6xl p-8"><p class="font-mono text-xs tracking-[.25em] text-cyan-300">HOST CONSOLE / INVESTIGATION CONTROL</p><div class="mt-5 grid gap-6 md:grid-cols-[1fr_270px]"><section><h1 id="current" class="text-4xl font-black"></h1><div class="mt-6 grid gap-2 sm:grid-cols-3" id="phases"></div><div class="mt-8 grid gap-5 lg:grid-cols-2"><section class="rounded border border-slate-700 p-5"><h2 class="font-bold">Game 1 · Quiz control</h2><div class="mt-3 flex flex-wrap gap-2"><button onclick="startG1()" class="bg-cyan-400 px-3 py-2 font-bold text-slate-950">START GROUP CASES</button><button onclick="nextG1()" class="border border-slate-500 px-3 py-2">NEXT QUESTION</button><button onclick="settleG1()" class="bg-amber-300 px-3 py-2 font-bold text-slate-950">SETTLE GAME 1</button></div><p class="mt-3 text-xs text-slate-400">Three group cases, then five common cases. The fifth common case awards time bonus.</p></section><section class="rounded border border-slate-700 p-5"><h2 class="font-bold">Game 2 · Evidence Board</h2><div class="mt-3 flex flex-wrap gap-2"><button onclick="startBingo()" class="bg-cyan-400 px-3 py-2 font-bold text-slate-950">CREATE BOARDS + START</button><button onclick="drawBingo()" class="bg-amber-300 px-3 py-2 font-bold text-slate-950">DRAW NEXT</button><button onclick="settleBingo()" class="border border-slate-500 px-3 py-2">SETTLE GAME 2</button></div><p id="bingo" class="mt-3 text-sm text-slate-300">No phrase drawn</p></section><section class="rounded border border-slate-700 p-5"><h2 class="font-bold">Game 3 winner</h2><button onclick="winner('boy')" class="mt-3 mr-2 bg-blue-500 px-4 py-2 font-bold">BOY</button><button onclick="winner('girl')" class="mt-3 bg-pink-500 px-4 py-2 font-bold">GIRL</button></section></div></section><aside class="rounded border border-slate-700 bg-slate-900 p-4"><p class="font-mono text-xs text-cyan-300">PLAYER QR</p><div id="qr" class="mt-4 rounded bg-white p-3"></div><a id="url" class="mt-3 block break-all text-xs text-cyan-300"></a></aside></div></main><script>
if(!Game.init())document.body.innerHTML='<p class="p-8">Configure Firebase in config.js first.</p>';else{Game.ensureState();const el=document.querySelector('#phases');GENDER_REVEAL_CONFIG.phases.forEach((p,i)=>{let b=document.createElement('button');b.className='rounded border border-slate-700 p-3 text-left hover:bg-slate-800';b.textContent=String(i+1).padStart(2,'0')+'  '+p.replaceAll('_',' ');b.onclick=()=>Game.setPhase(p);el.append(b)});let u=Game.playerUrl();document.querySelector('#url').href=u;document.querySelector('#url').textContent=u;new QRCode(document.querySelector('#qr'),{text:u,width:220,height:220});Game.stateRef.on('value',s=>{s=s.val()||{};document.querySelector('#current').textContent=(s.current_phase||'ONBOARDING').replaceAll('_',' ');document.querySelector('#bingo').textContent=s.current_bingo_phrase||'No phrase drawn'});
async function startG1(){await Game.stateRef.update({current_phase:'GAME1_QUIZ',game1_mode:'group',current_question_index:0,game1_started_at:Game.now(),question_started_at:Game.now()})}async function nextG1(){let s=await Game.state();let mode=s.game1_mode||'group',i=(s.current_question_index||0)+1;if(mode==='group'&&i>=3){mode='common';i=0}if(mode==='common'&&i>=5)return alert('All five common cases are complete. Settle Game 1.');await Game.stateRef.update({current_phase:'GAME1_QUIZ',game1_mode:mode,current_question_index:i,question_started_at:Game.now()})}
async function settleG1(){let [ps,cs,gs,snap]=await Promise.all([Game.ref('players').once('value'),Game.ref('common_quiz').once('value'),Game.ref('group_quiz').once('value'),Game.stateRef.once('value')]),players=ps.val()||{},common=Game.normalizeCollection(cs.val()),groups=gs.val()||{},questionStarted=(snap.val()||{}).question_started_at;for(const [id,p] of Object.entries(players)){let score=0,a=p.game1_answers||{},own=Game.normalizeCollection(groups[p.group]);own.slice(0,3).forEach((q,i)=>{let x=a['group_'+i];if(x&&Game.isCorrect(q,x.choice))score+=1000});common.slice(0,5).forEach((q,i)=>{let x=a['common_'+i];if(x&&Game.isCorrect(q,x.choice)){let bonus=0;if(i===4&&x.answered_at)bonus=Math.max(0,15-(Number(x.answered_at)-Number(questionStarted||x.answered_at))/1000)*33.3;score+=1000+bonus}});await Game.ref('players/'+id).update({game1_score:Math.round(score),score:Math.round(score)})}let scores=Object.entries((await Game.ref('players').once('value')).val()||{}).map(([id,p])=>[id,p.game1_score||0]);for(const [id,score] of scores){let rank=1+scores.filter(x=>x[1]>score).length;await Game.awardOnce(id,'game1',rank<=10?[3]:rank<=20?[2]:[1])}await Game.setPhase('GAME1_SETTLE')}
async function startBingo(){let [phrases,ps]=await Promise.all([Game.ref('bingo_phrases').once('value'),Game.ref('players').once('value')]),pool=Game.normalizeCollection(phrases.val()).map(x=>typeof x.value==='string'?x.value:x.phrase||x.text).filter(Boolean);if(pool.length<9)return alert('Bingo needs at least 9 phrases.');let updates={};ps.forEach(p=>{let deck=[...pool].sort(()=>Math.random()-.5);updates['players/'+p.key+'/bingo_board']=deck.slice(0,9);updates['players/'+p.key+'/bingo_marks']=null;updates['players/'+p.key+'/bingo_lines']=0;updates['players/'+p.key+'/bingo_completed_at']=null});await Game.ref().update(updates);await Game.stateRef.update({current_phase:'GAME2_BINGO',current_bingo_phrase:null,drawn_bingo_phrases:{},bingo_finishers:{},bingo_cutoff:false,bingo_cutoff_bucket:null})}
async function drawBingo(){const pool=Game.normalizeCollection((await Game.ref('bingo_phrases').once('value')).val());await Game.stateRef.transaction(s=>{s||=Game.baseState();s.drawn_bingo_phrases||={};let left=pool.filter(q=>!s.drawn_bingo_phrases[q.id]);if(!left.length)return s;let n=left[Math.floor(Math.random()*left.length)],phrase=typeof n.value==='string'?n.value:n.phrase||n.text;s.current_bingo_phrase=phrase;s.drawn_bingo_phrases[n.id]=phrase;return s})}
async function settleBingo(){let ps=(await Game.ref('players').once('value')).val()||{},finish=(await Game.state()).bingo_finishers||{};for(const [id,p] of Object.entries(ps)){let levels=finish[id]?[3]:(p.bingo_lines||0)>=1?[2,1]:[1];await Game.awardOnce(id,'game2',levels)}await Game.setPhase('GAME2_SETTLE')}
async function winner(team){await Game.stateRef.update({winning_team:team});let ps=(await Game.ref('players').once('value')).val()||{};for(const [id,p] of Object.entries(ps))if(p.team===team)await Game.awardOnce(id,'game3',[3,2])}window.startG1=startG1;window.nextG1=nextG1;window.settleG1=settleG1;window.startBingo=startBingo;window.drawBingo=drawBingo;window.settleBingo=settleBingo;window.winner=winner;}
</script><script>
/* Store compact public settlement data so display clients never need to infer ranks. */
const settleGame1=window.settleG1,settleGame2=window.settleBingo;
window.settleG1=async()=>{await settleGame1();let p=(await Game.ref('players').once('value')).val()||{},list=Object.entries(p).map(([id,x])=>({id,name:x.name,score:x.game1_score||0})).sort((a,b)=>b.score-a.score).map((x,i,a)=>({...x,rank:1+a.filter(y=>y.score>x.score).length}));await Game.stateRef.update({game1_leaderboard:list})};
window.settleBingo=async()=>{await settleGame2();let p=(await Game.ref('players').once('value')).val()||{},list=Object.entries(p).filter(([,x])=>x.bingo_completed_at).sort((a,b)=>(a[1].bingo_completed_at||0)-(b[1].bingo_completed_at||0)).map(([id,x],i)=>({id,name:x.name,lines:x.bingo_lines||0,place:i+1}));await Game.stateRef.update({game2_finishers:list})};
</script></body></html>
