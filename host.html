<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Reveal — Host</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="config.js"></script></head><body class="bg-slate-950 text-stone-100"><main class="mx-auto max-w-5xl p-8"><p class="font-mono text-xs tracking-[.25em] text-cyan-300">HOST CONSOLE / INVESTIGATION CONTROL</p><div class="mt-5 grid gap-6 md:grid-cols-[1fr_270px]"><section><h1 id="current" class="text-4xl font-black"></h1><div class="mt-6 grid gap-2 sm:grid-cols-3" id="phases"></div><div class="mt-8 rounded border border-slate-700 p-5"><h2 class="font-bold">Bingo evidence draw</h2><p id="bingo" class="mt-2 text-slate-300">No phrase drawn</p><button onclick="drawBingo()" class="mt-4 rounded bg-amber-300 px-4 py-2 font-bold text-slate-950">DRAW NEXT PHRASE</button></div><div class="mt-5 rounded border border-slate-700 p-5"><h2 class="font-bold">Game 3 winner</h2><button onclick="winner('boy')" class="mt-3 mr-2 bg-blue-500 px-4 py-2 font-bold">BOY</button><button onclick="winner('girl')" class="mt-3 bg-pink-500 px-4 py-2 font-bold">GIRL</button></div></section><aside class="rounded border border-slate-700 bg-slate-900 p-4"><p class="font-mono text-xs text-cyan-300">PLAYER QR</p><div id="qr" class="mt-4 rounded bg-white p-3"></div><a id="url" class="mt-3 block break-all text-xs text-cyan-300"></a></aside></div></main><script>
if(!Game.init())document.body.innerHTML='<p class="p-8">Configure Firebase in config.js first.</p>';else{Game.ensureState();const el=document.querySelector('#phases');GENDER_REVEAL_CONFIG.phases.forEach((p,i)=>{let b=document.createElement('button');b.className='rounded border border-slate-700 p-3 text-left hover:bg-slate-800';b.textContent=String(i+1).padStart(2,'0')+'  '+p.replaceAll('_',' ');b.onclick=()=>Game.setPhase(p);el.append(b)});let u=Game.playerUrl();document.querySelector('#url').href=u;document.querySelector('#url').textContent=u;new QRCode(document.querySelector('#qr'),{text:u,width:220,height:220});Game.stateRef.on('value',s=>{s=s.val()||{};document.querySelector('#current').textContent=(s.current_phase||'ONBOARDING').replaceAll('_',' ');document.querySelector('#bingo').textContent=s.current_bingo_phrase||'No phrase drawn'});
async function drawBingo(){const x=(await Game.ref('bingo_phrases').once('value')).val()||{};const pool=Game.normalizeCollection(x);await Game.stateRef.transaction(s=>{s||=Game.baseState();s.drawn_bingo_phrases||={};const left=pool.filter(q=>!s.drawn_bingo_phrases[q.id]);if(!left.length)return s;const n=left[Math.floor(Math.random()*left.length)];s.current_bingo_phrase=typeof n.value==='string'?n.value:n.phrase||n.text;s.drawn_bingo_phrases[n.id]=s.current_bingo_phrase;return s})} window.drawBingo=drawBingo;
function winner(team){Game.stateRef.update({winning_team:team});Game.ref('players').once('value').then(s=>s.forEach(p=>{if(p.val().team===team)Game.addClues(p.key,[3,2])}))}window.winner=winner;}
</script></body></html>
