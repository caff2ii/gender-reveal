<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主持人控制台 — Gender Reveal Party</title>

<script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-database-compat.js"></script>
<script src="config.js"></script>

<style>
  :root{
    --bg-base:#0d0f13;
    --bg-panel:#171a21;
    --bg-panel-raised:#1e222b;
    --line:#2a2f3a;
    --text-main:#e8eaf0;
    --text-dim:#8890a0;
    --accent-amber:#e8a33d;
    --accent-teal:#2dd4bf;
    --accent-red:#ef5555;
    --accent-green:#3ecf7a;
    --accent-boy:#4d8fe8;
    --accent-girl:#e85fa0;
  }
  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,163,61,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(45,212,191,0.06), transparent 60%),
      var(--bg-base);
    color:var(--text-main);
    font-family:'Noto Sans TC','Space Grotesk',sans-serif;
    min-height:100vh;
  }
  .font-display{font-family:'Space Grotesk','Noto Sans TC',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:14px;
  }
  .step-dot{
    width:14px;height:14px;border-radius:999px;
    background:var(--bg-panel-raised);
    border:2px solid var(--line);
    flex-shrink:0;
    transition:all .2s ease;
  }
  .step-item.is-active .step-dot{
    background:var(--accent-amber);
    border-color:var(--accent-amber);
    box-shadow:0 0 0 4px rgba(232,163,61,0.2);
  }
  .step-item.is-done .step-dot{
    background:var(--accent-teal);
    border-color:var(--accent-teal);
  }
  .step-line{
    width:2px;flex:1;background:var(--line);
    min-height:14px;
  }
  .step-item.is-done .step-line{background:var(--accent-teal);opacity:.4;}
  .step-btn{
    text-align:left;width:100%;
    padding:10px 14px;border-radius:10px;
    border:1px solid transparent;
    color:var(--text-dim);
    transition:all .15s ease;
  }
  .step-btn:hover{background:var(--bg-panel-raised);color:var(--text-main);}
  .step-item.is-active .step-btn{
    background:rgba(232,163,61,0.1);
    border-color:rgba(232,163,61,0.35);
    color:var(--accent-amber);
    font-weight:600;
  }
  .btn{
    padding:10px 18px;border-radius:10px;font-weight:600;
    transition:transform .1s ease, opacity .15s ease;
    font-family:'Space Grotesk','Noto Sans TC',sans-serif;
    cursor:pointer;
  }
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-amber{background:var(--accent-amber);color:#241a05;}
  .btn-teal{background:var(--accent-teal);color:#04211d;}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--text-main);}
  .btn-outline:hover{border-color:var(--accent-teal);}
  .btn-danger{background:var(--accent-red);color:#2a0505;}
  .btn-boy{background:var(--accent-boy);color:#031126;}
  .btn-girl{background:var(--accent-girl);color:#2a0517;}
  .pulse-dot{
    width:8px;height:8px;border-radius:999px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .scrollbar-thin::-webkit-scrollbar{width:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
</style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto">

  <!-- Header -->
  <header class="flex flex-wrap items-center justify-between gap-4 mb-8">
    <div>
      <p class="font-mono text-xs text-[var(--text-dim)] tracking-widest uppercase">Mission Control</p>
      <h1 class="font-display text-2xl md:text-3xl font-bold">主持人控制台</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="panel px-4 py-2 flex items-center gap-2">
        <span id="conn-dot" class="pulse-dot bg-[var(--accent-red)]"></span>
        <span id="conn-text" class="font-mono text-xs text-[var(--text-dim)]">連接中…</span>
      </div>
      <div class="panel px-4 py-2">
        <span class="font-mono text-xs text-[var(--text-dim)]">在場玩家</span>
        <span id="player-count" class="font-display font-bold text-lg text-[var(--accent-amber)] ml-2">0</span>
      </div>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-6">

    <!-- Left: Phase Stepper -->
    <div class="panel p-5">
      <h2 class="font-display font-semibold text-sm text-[var(--text-dim)] uppercase tracking-wide mb-4">遊戲階段推進</h2>
      <div id="stepper" class="flex flex-col"></div>
    </div>

    <!-- Right: Context Panel + Overview -->
    <div class="flex flex-col gap-6">

      <div class="panel p-6">
        <div class="flex items-center justify-between mb-1">
          <p class="font-mono text-xs text-[var(--text-dim)] uppercase tracking-widest">目前階段</p>
        </div>
        <h2 id="current-phase-label" class="font-display text-xl font-bold text-[var(--accent-amber)] mb-6">—</h2>

        <div id="context-panel">
          <p class="text-[var(--text-dim)] text-sm">請於左側選擇一個階段開始控制流程。</p>
        </div>
      </div>

      <!-- Player Overview -->
      <div class="panel p-6">
        <h2 class="font-display font-semibold text-sm text-[var(--text-dim)] uppercase tracking-wide mb-4">玩家總覽（即時分數 Top 8）</h2>
        <div id="player-overview" class="font-mono text-sm text-[var(--text-dim)] space-y-1">尚無玩家資料</div>
      </div>

      <!-- Danger Zone -->
      <div class="panel p-6" style="border-color:rgba(239,85,85,0.3)">
        <h2 class="font-display font-semibold text-sm text-[var(--accent-red)] uppercase tracking-wide mb-2">危險區域</h2>
        <p class="text-[var(--text-dim)] text-sm mb-4">重置只會清空「玩家資料」與「遊戲狀態」，題庫 / 線索 / Bingo 句庫 / 秘密性別完全不受影響，方便你自行測試。</p>
        <button onclick="openResetModal()" class="btn btn-danger">重置所有測試數據</button>
      </div>

    </div>
  </div>
</div>

<!-- Reset Confirm Modal -->
<div id="reset-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
  <div class="panel p-6 max-w-sm w-full">
    <h3 class="font-display font-bold text-lg mb-2 text-[var(--accent-red)]">確認重置？</h3>
    <p class="text-sm text-[var(--text-dim)] mb-4">此動作會刪除所有玩家資料並將遊戲狀態返回「ONBOARDING」。請輸入 <span class="font-mono text-[var(--text-main)]">RESET</span> 以確認。</p>
    <input id="reset-confirm-input" type="text" class="w-full bg-[var(--bg-panel-raised)] border border-[var(--line)] rounded-lg px-3 py-2 font-mono text-sm mb-4" placeholder="輸入 RESET">
    <div class="flex gap-3">
      <button onclick="closeResetModal()" class="btn btn-outline flex-1">取消</button>
      <button onclick="confirmReset()" class="btn btn-danger flex-1">確認重置</button>
    </div>
  </div>
</div>

<script>
firebase.initializeApp(CONFIG.firebaseConfig);
const db = firebase.database();

const PHASES = [
  { id:'ONBOARDING',          label:'玩家進場報到' },
  { id:'BACKGROUND_STORY',    label:'開場背景故事' },
  { id:'GAME1_RULES',         label:'Game 1 規則說明' },
  { id:'GAME1_QUIZ',          label:'Game 1 競速問答' },
  { id:'GAME1_SETTLE',        label:'Game 1 結算 + 派發線索' },
  { id:'GAME2_RULES',         label:'Game 2 規則說明' },
  { id:'GAME2_BINGO',         label:'Game 2 迷信 Bingo' },
  { id:'GAME2_SETTLE',        label:'Game 2 結算 + 派發線索' },
  { id:'GAME3_RULES',         label:'Game 3 規則說明' },
  { id:'GAME3_TEAM_SELECT',   label:'Game 3 站隊 / Switch 對決' },
  { id:'FINAL_CHOICE',        label:'最終意向鎖定' },
  { id:'GRAND_REVEAL',        label:'Grand Reveal 揭曉' }
];

let currentPhase = null;
let currentGameState = {};
let latestPlayers = {};

// ---------- 連線狀態 ----------
db.ref('.info/connected').on('value', (snap) => {
  const connected = snap.val() === true;
  document.getElementById('conn-dot').style.background = connected ? 'var(--accent-green)' : 'var(--accent-red)';
  document.getElementById('conn-text').textContent = connected ? '已連接 Firebase' : '連接中…';
});

// ---------- 渲染 Stepper ----------
function renderStepper(){
  const wrap = document.getElementById('stepper');
  wrap.innerHTML = '';
  const currentIdx = PHASES.findIndex(p => p.id === currentPhase);
  PHASES.forEach((p, idx) => {
    const isActive = p.id === currentPhase;
    const isDone = currentIdx > -1 && idx < currentIdx;
    const item = document.createElement('div');
    item.className = `step-item flex gap-3 ${isActive ? 'is-active':''} ${isDone ? 'is-done':''}`;
    item.innerHTML = `
      <div class="flex flex-col items-center">
        <div class="step-dot"></div>
        ${idx < PHASES.length-1 ? '<div class="step-line"></div>' : ''}
      </div>
      <div class="flex-1 pb-4">
        <button class="step-btn" onclick="setPhase('${p.id}')">
          <span class="font-mono text-[10px] text-[var(--text-dim)] block">${String(idx+1).padStart(2,'0')}</span>
          ${p.label}
        </button>
      </div>`;
    wrap.appendChild(item);
  });
}

// ---------- 監聽 game_state ----------
db.ref('game_state').on('value', (snap) => {
  currentGameState = snap.val() || {};
  currentPhase = currentGameState.current_phase || 'ONBOARDING';
  renderStepper();
  const phaseObj = PHASES.find(p => p.id === currentPhase);
  document.getElementById('current-phase-label').textContent = phaseObj ? phaseObj.label : currentPhase;
  renderContextPanel();
});

// ---------- 監聽玩家 ----------
db.ref('players').on('value', (snap) => {
  latestPlayers = snap.val() || {};
  const ids = Object.keys(latestPlayers);
  document.getElementById('player-count').textContent = ids.length;

  const overview = document.getElementById('player-overview');
  if (ids.length === 0){
    overview.textContent = '尚無玩家資料';
    return;
  }
  const sorted = ids.sort((a,b)=> (latestPlayers[b].score||0) - (latestPlayers[a].score||0)).slice(0,8);
  overview.innerHTML = sorted.map((id,i)=>{
    const p = latestPlayers[id];
    return `<div class="flex justify-between border-b border-[var(--line)] py-1">
      <span class="text-[var(--text-main)]">#${i+1} ${escapeHtml(p.name||'(未命名)')} <span class="text-[var(--text-dim)]">[${p.group||'-'}]</span></span>
      <span class="text-[var(--accent-amber)]">${p.score||0} 分</span>
    </div>`;
  }).join('');
  renderContextPanel();
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

// ---------- 設定階段 ----------
async function setPhase(id){
  const updates = { 'game_state/current_phase': id };
  if (id === 'GAME1_QUIZ'){
    updates['game_state/game1_stage'] = 'EXCLUSIVE';
    updates['game_state/common_reveal_stage'] = 0;
    updates['game_state/current_question_index'] = 0;
    updates['game_state/countdown_start_at'] = null;
  }
  if (id === 'GRAND_REVEAL'){
    updates['game_state/reveal_triggered_at'] = null;
  }
  await db.ref().update(updates);
  if (id === 'GAME1_SETTLE') await settleGame1();
  if (id === 'GAME2_SETTLE') await settleGame2();
}

// ---------- 線索遞補核心邏輯 ----------
// chain：由被授予的 level 開始，向下嘗試至 level1；全滿則放棄（等於已達 100%）
const LEVEL_CHAIN = {
  level3: ['level3','level2','level1'],
  level2: ['level2','level1'],
  level1: ['level1']
};

function awardClueLevel(playerObj, level){
  const chain = LEVEL_CHAIN[level];
  const unlocked = (playerObj.unlocked_clues || []).slice();
  for (const lvl of chain){
    for (let i=0; i<CONFIG.game.cluesPerLevel; i++){
      const clueId = `${lvl}_${i}`;
      if (!unlocked.includes(clueId)){
        unlocked.push(clueId);
        return unlocked;
      }
    }
  }
  return unlocked; // 已全部集齊，等同 100%
}

// ---------- Game 1 結算 ----------
async function settleGame1(){
  const snap = await db.ref('players').get();
  const players = snap.val() || {};
  const ids = Object.keys(players);
  if (ids.length === 0) return;

  ids.sort((a,b) => (players[b].score||0) - (players[a].score||0));

  const updates = {};
  let rank = 0, prevScore = null, seen = 0;
  ids.forEach(id => {
    seen++;
    const score = players[id].score || 0;
    if (score !== prevScore){ rank = seen; prevScore = score; }
    let level;
    if (rank <= CONFIG.game.game1RankThresholds.top) level = 'level3';
    else if (rank <= CONFIG.game.game1RankThresholds.mid) level = 'level2';
    else level = 'level1';
    const newUnlocked = awardClueLevel(players[id], level);
    players[id].unlocked_clues = newUnlocked;
    updates[`players/${id}/unlocked_clues`] = newUnlocked;
  });
  await db.ref().update(updates);
  alert('Game 1 結算完成，線索已派發。');
}

// ---------- Game 2 結算 ----------
async function settleGame2(){
  const snap = await db.ref('players').get();
  const players = snap.val() || {};
  const ids = Object.keys(players);
  if (ids.length === 0) return;

  const qualified = ids
    .filter(id => (players[id].bingo_lines||0) >= CONFIG.game.bingoLinesToQualify && players[id].bingo_completed_at)
    .sort((a,b) => players[a].bingo_completed_at - players[b].bingo_completed_at);

  const updates = {};
  const top10Ids = [];
  let rank = 0, prevTime = null, seen = 0;
  qualified.forEach(id => {
    seen++;
    const t = players[id].bingo_completed_at;
    if (t !== prevTime){ rank = seen; prevTime = t; }
    if (rank <= CONFIG.game.bingoQualifyCap) top10Ids.push(id);
  });

  top10Ids.forEach(id => {
    const newUnlocked = awardClueLevel(players[id], 'level3');
    players[id].unlocked_clues = newUnlocked;
    updates[`players/${id}/unlocked_clues`] = newUnlocked;
  });

  ids.forEach(id => {
    if (top10Ids.includes(id)) return;
    const lines = players[id].bingo_lines || 0;
    if (lines === 1){
      CONFIG.game.bingoOneLineFallbackLevels.forEach(lvl => {
        const newUnlocked = awardClueLevel(players[id], lvl);
        players[id].unlocked_clues = newUnlocked;
        updates[`players/${id}/unlocked_clues`] = newUnlocked;
      });
    } else if (lines === 0){
      const newUnlocked = awardClueLevel(players[id], CONFIG.game.bingoZeroLineFallbackLevel);
      players[id].unlocked_clues = newUnlocked;
      updates[`players/${id}/unlocked_clues`] = newUnlocked;
    }
    // lines===2 但錯過 cutoff：本輪不另外派發（維持原設計，屬極邊緣情況）
  });

  await db.ref().update(updates);
  alert(`Game 2 結算完成：${top10Ids.length} 位玩家達標取得 Lv3，線索已派發。`);
}

// ---------- Bingo 抽句子 ----------
async function drawNextBingoPhrase(){
  const [phrasesSnap, gsSnap] = await Promise.all([
    db.ref('bingo_phrases').get(),
    db.ref('game_state').get()
  ]);
  const phrasesObj = phrasesSnap.val() || {};
  const allPhrases = Object.values(phrasesObj).filter(Boolean);
  const drawnObj = (gsSnap.val()||{}).drawn_bingo_phrases || {};
  const drawnList = Object.values(drawnObj).map(d => (typeof d === 'string') ? d : d.phrase);

  const remaining = allPhrases.filter(p => !drawnList.includes(p));
  if (remaining.length === 0){
    alert('所有 Bingo 句子已經抽完！');
    return;
  }
  const chosen = remaining[Math.floor(Math.random() * remaining.length)];
  const key = db.ref('game_state/drawn_bingo_phrases').push().key;
  const updates = {};
  updates[`game_state/drawn_bingo_phrases/${key}`] = { phrase: chosen, drawn_at: firebase.database.ServerValue.TIMESTAMP };
  updates['game_state/current_bingo_phrase'] = chosen;
  await db.ref().update(updates);
}

// ---------- Game 3 宣布勝方 ----------
async function declareGame3Winner(team){
  if (!confirm(`確認宣布 Team ${team} 勝出？此動作會即時派發線索。`)) return;
  const snap = await db.ref('players').get();
  const players = snap.val() || {};
  const updates = {};
  Object.keys(players).forEach(id => {
    if (players[id].team === team){
      CONFIG.game.game3WinnerLevels.forEach(lvl => {
        const newUnlocked = awardClueLevel(players[id], lvl);
        players[id].unlocked_clues = newUnlocked;
        updates[`players/${id}/unlocked_clues`] = newUnlocked;
      });
    }
  });
  updates['game_state/winning_team'] = team;
  await db.ref().update(updates);
}

// ---------- Game 1 共同題 逐項推進 ----------
const STAGE_LABELS = ['等待開始','已顯示題目','已顯示選項 A','已顯示選項 B','已顯示選項 C','已顯示選項 D','搶答倒數中'];

async function switchToCommonQuiz(){
  await db.ref().update({
    'game_state/game1_stage': 'COMMON',
    'game_state/current_question_index': 0,
    'game_state/common_reveal_stage': 0,
    'game_state/countdown_start_at': null
  });
}

async function nextRevealStage(){
  let stage = currentGameState.common_reveal_stage || 0;
  if (stage >= 6) return;
  stage++;
  const updates = { 'game_state/common_reveal_stage': stage };
  if (stage === 6) updates['game_state/countdown_start_at'] = firebase.database.ServerValue.TIMESTAMP;
  await db.ref().update(updates);
}

async function nextCommonQuestion(){
  const idx = (currentGameState.current_question_index || 0) + 1;
  await db.ref().update({
    'game_state/current_question_index': idx,
    'game_state/common_reveal_stage': 0,
    'game_state/countdown_start_at': null
  });
}

// ---------- Grand Reveal 倒數觸發 ----------
async function triggerRevealCountdown(){
  if (!confirm('確認啟動 5 秒倒數並揭曉性別？')) return;
  await db.ref('game_state/reveal_triggered_at').set(firebase.database.ServerValue.TIMESTAMP);
}

// ---------- 依階段渲染右側控制面板 ----------
function renderContextPanel(){
  const panel = document.getElementById('context-panel');
  const drawnCount = Object.keys(currentGameState.drawn_bingo_phrases || {}).length;

  switch(currentPhase){

    case 'GAME1_QUIZ': {
      const stage = currentGameState.game1_stage || 'EXCLUSIVE';
      if (stage === 'EXCLUSIVE'){
        panel.innerHTML = `
          <p class="text-sm text-[var(--text-dim)] mb-4">玩家現正作答各自 Friend Group 的 3 條專屬題（手機端自動呈現，毋須主持人介入）。完成後按下方按鈕進入共同題環節。</p>
          <button onclick="switchToCommonQuiz()" class="btn btn-amber">切換至共同題環節 →</button>`;
      } else {
        const idx = currentGameState.current_question_index || 0;
        const stageNum = currentGameState.common_reveal_stage || 0;
        panel.innerHTML = `
          <p class="font-mono text-xs text-[var(--text-dim)] mb-1">共同題 第 ${idx+1} 題 / 共 5 題</p>
          <p class="text-sm mb-4">目前狀態：<span class="text-[var(--accent-amber)] font-semibold">${STAGE_LABELS[stageNum]}</span></p>
          <div class="flex flex-wrap gap-3">
            <button onclick="nextRevealStage()" ${stageNum>=6?'disabled':''} class="btn btn-amber">下一步（逐項顯示 / 開始倒數）</button>
            <button onclick="nextCommonQuestion()" class="btn btn-outline">下一題 →</button>
          </div>
          <p class="text-xs text-[var(--text-dim)] mt-4">流程：顯示題目 → 選項A → B → C → D → 開始15秒倒數。5 題完成後，前往左側「Game 1 結算」。</p>`;
      }
      break;
    }

    case 'GAME2_BINGO': {
      const current = currentGameState.current_bingo_phrase || '（尚未抽出）';
      panel.innerHTML = `
        <p class="font-mono text-xs text-[var(--text-dim)] mb-1">已抽出 ${drawnCount} 句</p>
        <p class="text-2xl font-display font-bold text-[var(--accent-teal)] mb-4">${escapeHtml(current)}</p>
        <button onclick="drawNextBingoPhrase()" class="btn btn-teal">抽下一句 🎲</button>
        <p class="text-xs text-[var(--text-dim)] mt-4">當累積 10 位玩家連滿 2 條線後，可考慮前往「Game 2 結算」。</p>`;
      break;
    }

    case 'GAME3_TEAM_SELECT': {
      const boyCount = Object.values(latestPlayers).filter(p=>p.team==='BOY').length;
      const girlCount = Object.values(latestPlayers).filter(p=>p.team==='GIRL').length;
      const winner = currentGameState.winning_team;
      panel.innerHTML = `
        <p class="text-sm text-[var(--text-dim)] mb-4">玩家已於手機端站隊：<span class="text-[var(--accent-boy)] font-semibold">Team Boy ${boyCount} 人</span> ／ <span class="text-[var(--accent-girl)] font-semibold">Team Girl ${girlCount} 人</span></p>
        <p class="text-xs text-[var(--text-dim)] mb-4">現場玩完 Switch 對決後，按下方按鈕宣布勝方（會自動派發線索）。</p>
        <div class="flex gap-3">
          <button onclick="declareGame3Winner('BOY')" class="btn btn-boy flex-1">宣布 Team Boy 勝出</button>
          <button onclick="declareGame3Winner('GIRL')" class="btn btn-girl flex-1">宣布 Team Girl 勝出</button>
        </div>
        ${winner ? `<p class="mt-4 text-sm">目前紀錄勝方：<span class="font-semibold">${winner}</span></p>` : ''}`;
      break;
    }

    case 'GRAND_REVEAL': {
      const triggered = currentGameState.reveal_triggered_at;
      panel.innerHTML = `
        <p class="text-sm text-[var(--text-dim)] mb-4">大螢幕現正顯示 Reveal 準備畫面。按下方按鈕啟動 5 秒倒數，並揭曉 secret_gender。</p>
        <button onclick="triggerRevealCountdown()" ${triggered?'disabled':''} class="btn btn-amber text-lg px-8 py-4">🎉 啟動 5 秒倒數揭曉</button>
        ${triggered ? '<p class="mt-3 text-sm text-[var(--accent-green)]">已觸發倒數。</p>' : ''}`;
      break;
    }

    case 'GAME1_SETTLE':
      panel.innerHTML = `<p class="text-sm text-[var(--text-dim)]">已於切換至此階段時自動結算排名並派發線索。可於下方「玩家總覽」查看即時分數。</p>
        <button onclick="settleGame1()" class="btn btn-outline mt-4">重新執行結算（若需要）</button>`;
      break;

    case 'GAME2_SETTLE':
      panel.innerHTML = `<p class="text-sm text-[var(--text-dim)]">已於切換至此階段時自動結算 Bingo 並派發線索。</p>
        <button onclick="settleGame2()" class="btn btn-outline mt-4">重新執行結算（若需要）</button>`;
      break;

    default:
      panel.innerHTML = `<p class="text-sm text-[var(--text-dim)]">此階段毋須額外操作，雙端（display.html / index.html）會自動同步呈現對應畫面。可於左側推進下一階段。</p>`;
  }
}

// ---------- Reset Modal ----------
function openResetModal(){
  document.getElementById('reset-modal').classList.remove('hidden');
  document.getElementById('reset-confirm-input').value = '';
}
function closeResetModal(){
  document.getElementById('reset-modal').classList.add('hidden');
}
async function confirmReset(){
  const val = document.getElementById('reset-confirm-input').value.trim();
  if (val !== 'RESET'){
    alert('請正確輸入 RESET 以確認。');
    return;
  }
  await db.ref('players').remove();
  await db.ref('game_state').set({
    current_phase: 'ONBOARDING',
    current_question_index: 0,
    current_bingo_phrase: '',
    winning_team: '',
    drawn_bingo_phrases: {},
    game1_stage: 'EXCLUSIVE',
    common_reveal_stage: 0,
    countdown_start_at: null,
    reveal_triggered_at: null
  });
  closeResetModal();
  alert('已重置玩家資料與遊戲狀態。');
}
</script>

</html>
