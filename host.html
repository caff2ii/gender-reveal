<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOST DASHBOARD - Game Controller</title>
  <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-mono min-h-screen p-4">

  <header class="max-w-4xl mx-auto flex justify-between items-center border-b border-gray-800 pb-4 mb-6">
    <div>
      <span class="text-xs bg-red-900 text-red-200 px-2 py-0.5 rounded font-bold">HOST COMMAND</span>
      <h1 class="text-xl font-black text-white">GENDER REVEAL CONTROL</h1>
    </div>
    <div class="text-right">
      <div id="player-count" class="text-xs text-green-400 font-bold">PLAYERS: 0</div>
      <div id="current-phase-display" class="text-xs text-yellow-400">PHASE: ONBOARDING</div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto space-y-6">

    <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg shadow-xl">
      <h2 class="text-xs font-bold text-gray-400 tracking-widest uppercase mb-3">GLOBAL PHASE STEPPER</h2>
      <div class="flex items-center space-x-3">
        <button onclick="prevPhase()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white font-bold py-3 px-4 rounded text-sm transition">
          ◀ PREV
        </button>
        <div class="flex-1 bg-gray-950 border border-gray-800 rounded p-3 text-center">
          <span class="text-xs text-gray-500 block">CURRENT ACTIVE PHASE:</span>
          <span id="active-phase-name" class="text-lg font-black text-blue-400 tracking-wider">ONBOARDING</span>
        </div>
        <button onclick="nextPhase()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded text-sm tracking-wider transition">
          NEXT PHASE ▶
        </button>
      </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg shadow-xl space-y-4">
      <h2 class="text-xs font-bold text-gray-400 tracking-widest uppercase mb-1">PHASE ACTIONS</h2>

      <div id="action-game1" class="hidden bg-gray-950 p-4 rounded border border-gray-800 space-y-3">
        <div class="text-sm font-bold text-yellow-400">GAME 1: COMMON QUIZ CONTROL</div>
        <div class="text-xs text-gray-400">Question Index: <span id="g1-q-index" class="text-white font-bold">0</span></div>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="advanceCommonQuizStep()" class="bg-purple-700 hover:bg-purple-600 text-white font-bold py-2 rounded text-xs">
            NEXT STEP (Show Question/Options)
          </button>
          <button onclick="startCommonQuizCountdown()" class="bg-red-700 hover:bg-red-600 text-white font-bold py-2 rounded text-xs">
            ⚡ START 15s COUNTDOWN
          </button>
        </div>
      </div>

      <div id="action-game2" class="hidden bg-gray-950 p-4 rounded border border-gray-800 space-y-3">
        <div class="text-sm font-bold text-yellow-400">GAME 2: BINGO DRAW CONTROL</div>
        <div class="text-xs text-gray-400">Current Phrase: <span id="g2-current-phrase" class="text-white font-bold">None</span></div>
        <button onclick="drawNextBingoPhrase()" class="w-full bg-green-700 hover:bg-green-600 text-white font-bold py-3 rounded text-sm tracking-wider">
          🎲 DRAW NEXT BINGO PHRASE
        </button>
      </div>

      <div id="action-game3" class="hidden bg-gray-950 p-4 rounded border border-gray-800 space-y-3">
        <div class="text-sm font-bold text-yellow-400">GAME 3: SWITCH BATTLE RESULT</div>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="settleGame3('BOY')" class="bg-blue-700 hover:bg-blue-600 text-white font-bold py-3 rounded text-xs uppercase">
            🏆 TEAM BOY WINS (+CLUES)
          </button>
          <button onclick="settleGame3('GIRL')" class="bg-pink-700 hover:bg-pink-600 text-white font-bold py-3 rounded text-xs uppercase">
            🏆 TEAM GIRL WINS (+CLUES)
          </button>
        </div>
      </div>

      <div id="action-reveal" class="hidden bg-gray-950 p-4 rounded border border-gray-800 space-y-3">
        <div class="text-sm font-bold text-yellow-400">GRAND REVEAL TRIGGER</div>
        <button onclick="triggerGrandReveal()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded text-base tracking-widest uppercase animate-pulse">
          🎆 START GRAND REVEAL (5s COUNTDOWN)
        </button>
      </div>
    </div>

    <div class="bg-gray-900 border border-red-900 p-4 rounded-lg shadow-xl">
      <h2 class="text-xs font-bold text-red-500 tracking-widest uppercase mb-2">DANGER ZONE</h2>
      <button onclick="resetAllTestData()" class="w-full bg-red-950 hover:bg-red-900 border border-red-700 text-red-200 font-bold py-3 rounded text-xs tracking-wider transition">
        🗑️ RESET ALL TEST DATA (Keep Questions & Secret Gender)
      </button>
    </div>

  </main>

  <script>
    firebase.initializeApp(window.CONFIG.firebase);
    const db = firebase.database();
    let currentPhaseIndex = 0;
    let gameState = {};

    // Sync Game State
    db.ref('game_state').on('value', snap => {
      gameState = snap.val() || {};
      const phase = gameState.current_phase || "ONBOARDING";
      currentPhaseIndex = window.CONFIG.phaseOrder.indexOf(phase);
      if (currentPhaseIndex === -1) currentPhaseIndex = 0;

      document.getElementById('active-phase-name').innerText = phase;
      document.getElementById('current-phase-display').innerText = `PHASE: ${phase}`;
      
      // Toggle Action Panels
      document.getElementById('action-game1').classList.toggle('hidden', phase !== 'GAME1_QUIZ');
      document.getElementById('action-game2').classList.toggle('hidden', phase !== 'GAME2_BINGO');
      document.getElementById('action-game3').classList.toggle('hidden', phase !== 'GAME3_TEAM_SELECT');
      document.getElementById('action-reveal').classList.toggle('hidden', phase !== 'GRAND_REVEAL');

      if (gameState.current_question_index !== undefined) {
        document.getElementById('g1-q-index').innerText = gameState.current_question_index;
      }
      if (gameState.current_bingo_phrase) {
        document.getElementById('g2-current-phrase').innerText = gameState.current_bingo_phrase;
      }
    });

    // Player Count Monitor
    db.ref('players').on('value', snap => {
      const players = snap.val() || {};
      document.getElementById('player-count').innerText = `PLAYERS: ${Object.keys(players).length}`;
    });

    function setPhase(phase) {
      db.ref('game_state/current_phase').set(phase);
    }

    function nextPhase() {
      if (currentPhaseIndex < window.CONFIG.phaseOrder.length - 1) {
        setPhase(window.CONFIG.phaseOrder[currentPhaseIndex + 1]);
      }
    }

    function prevPhase() {
      if (currentPhaseIndex > 0) {
        setPhase(window.CONFIG.phaseOrder[currentPhaseIndex - 1]);
      }
    }

    // Game 1 Actions
    function advanceCommonQuizStep() {
      const nextIdx = (gameState.current_question_index || 0) + 1;
      db.ref('game_state').update({
        current_question_index: nextIdx,
        common_quiz_step: 'QUESTION'
      });
    }

    function startCommonQuizCountdown() {
      db.ref('game_state/common_quiz_step').set('COUNTDOWN');
    }

    // Game 2 Actions
    function drawNextBingoPhrase() {
      db.ref('bingo_phrases').once('value', snap => {
        const phrases = snap.val() || [];
        const drawn = gameState.drawn_bingo_phrases || [];
        const available = phrases.filter(p => !drawn.includes(p));

        if (available.length === 0) {
          alert("All phrases have been drawn!");
          return;
        }

        const picked = available[Math.floor(Math.random() * available.length)];
        drawn.push(picked);

        db.ref('game_state').update({
          current_bingo_phrase: picked,
          drawn_bingo_phrases: drawn
        });
      });
    }

    // Game 3 Actions
    function settleGame3(winningTeam) {
      if (!confirm(`Confirm TEAM ${winningTeam} Wins? Clues will be distributed.`)) return;
      
      db.ref().once('value', snap => {
        const root = snap.val() || {};
        const players = root.players || {};
        const allClues = root.clues || {};

        const updates = {};
        Object.keys(players).forEach(pid => {
          const p = players[pid];
          if (p.team === winningTeam) {
            // Reward Lv3 + Lv2
            let res1 = window.GenderRevealUtils.assignClueWithOverflow(p.unlocked_clues || [], 'level3', allClues);
            let res2 = window.GenderRevealUtils.assignClueWithOverflow(res1.unlocked_clues, 'level2', allClues);
            updates[`players/${pid}/unlocked_clues`] = res2.unlocked_clues;
          }
        });

        db.ref().update(updates).then(() => {
          alert(`Game 3 Settled! Target clues distributed to Team ${winningTeam}.`);
          setPhase('FINAL_CHOICE');
        });
      });
    }

    function triggerGrandReveal() {
      db.ref('game_state/reveal_trigger').set(Date.now());
    }

    // Reset All Data Rule Verification (Must NOT delete questions, bingo_phrases, clues, secret_gender)
    function resetAllTestData() {
      if (confirm("Are you sure you want to RESET ALL TEST DATA?\nThis will clear all players and reset game phase to ONBOARDING.")) {
        db.ref('players').remove();
        db.ref('game_state').set({
          current_phase: "ONBOARDING",
          current_question_index: 0,
          current_bingo_phrase: "",
          drawn_bingo_phrases: []
        });
        alert("System reset completed successfully!");
      }
    }
  </script>
</body>
</html>
