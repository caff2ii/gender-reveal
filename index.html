<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Reveal — Player</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="config.js"></script></head><body class="min-h-screen bg-slate-950 text-stone-100"><main class="mx-auto max-w-md p-6"><p class="font-mono text-xs tracking-[.25em] text-cyan-300">CASE REVEAL / PLAYER</p><h1 class="mt-8 text-5xl font-black leading-none">JOIN THE<br>INVESTIGATION</h1><section id="join" class="mt-10 space-y-4"><input id="name" class="w-full rounded border border-slate-600 bg-slate-900 p-4" placeholder="Your name"><select id="group" class="w-full rounded border border-slate-600 bg-slate-900 p-4"></select><button id="joinBtn" class="w-full rounded bg-cyan-400 p-4 font-bold text-slate-950">GET MY CASE PIN</button></section><section id="game" class="hidden mt-10"><p id="pin" class="font-mono text-cyan-300"></p><h2 id="phase" class="mt-3 text-2xl font-bold"></h2><div id="content" class="mt-6"></div></section></main><script>
const g=Game,$=id=>document.getElementById(id),C=GENDER_REVEAL_CONFIG;C.groups.forEach(([id,n])=>$('group').add(new Option(n,id)));let me=localStorage.caseRevealPlayer,player,state={};
async function join(){const name=$('name').value.trim();if(!name)return alert('Please enter your name.');const pin=await g.uniquePin(),r=g.ref('players').push();await r.set({name,group:$('group').value,pin,joined_at:g.now(),score:0,clue_library:{level1:[],level2:[],level3:[]}});localStorage.caseRevealPlayer=r.key;me=r.key;show()}$('joinBtn').onclick=join;
function show(){if(!me)return;$('join').classList.add('hidden');$('game').classList.remove('hidden');g.ref('players/'+me).on('value',s=>{player=s.val();if(!player){localStorage.removeItem('caseRevealPlayer');location.reload();return}$('pin').textContent='CASE PIN  '+player.pin;render()});g.stateRef.on('value',s=>{state=s.val()||{};render()})}
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function late(){return state.game1_started_at&&player.joined_at&&player.joined_at>state.game1_started_at}
async function game1(){if(late())return '<p class="text-slate-400">This case has already begun. You can join the next game.</p>';let qset;if(state.game1_mode==='group')qset=g.normalizeCollection((await g.ref('group_quiz/'+player.group).once('value')).val());else qset=g.normalizeCollection((await g.ref('common_quiz').once('value')).val());const q=qset[state.current_question_index||0];if(!q)return '<p>Waiting for the next question…</p>';let opts=g.questionOptions(q),key=(state.game1_mode||'group')+'_'+(state.current_question_index||0),already=player.game1_answers&&player.game1_answers[key];return '<p class="font-mono text-xs text-amber-300">EVIDENCE '+((state.current_question_index||0)+1)+'</p><h3 class="mt-2 text-2xl font-bold">'+esc(g.questionText(q))+'</h3>'+opts.map((o,i)=>'<button '+(already?'disabled':'')+' onclick="answer('+i+')" class="mt-3 w-full rounded border border-slate-600 bg-slate-900 p-4 text-left disabled:opacity-50"><b>'+"ABCD"[i]+'</b>　'+esc(o)+'</button>').join('')+(already?'<p class="mt-4 text-cyan-300">Answer locked. Await the host.</p>':'')}
async function answer(index){let mode=state.game1_mode||'group',key=mode+'_'+(state.current_question_index||0);await g.ref('players/'+me).transaction(p=>{p.game1_answers||={};if(!p.game1_answers[key])p.game1_answers[key]={choice:index,answered_at:firebase.database.ServerValue.TIMESTAMP};return p})}
async function bingo(){let b=player.bingo_board;if(!b)return '<p>Host is preparing your evidence board…</p>';let drawn=Object.values(state.drawn_bingo_phrases||{}),current=state.current_bingo_phrase,marks=player.bingo_marks||{};return '<p class="mb-4 text-sm text-slate-300">Mark a card only after it has been drawn. '+g.lineCount(marks)+' line(s) complete.</p><div class="grid grid-cols-3 gap-2">'+b.map((x,i)=>{let eligible=drawn.includes(x),active=marks[i],pulse=eligible&&!active&&x===current?'ring-4 ring-red-500 animate-pulse':'';return '<button onclick="mark('+i+')" class="aspect-square overflow-hidden rounded border p-2 text-xs '+(active?'border-cyan-300 bg-cyan-300 text-slate-950':eligible?'border-amber-300 bg-slate-800 '+pulse:'border-slate-700 bg-slate-900 opacity-60')+'">'+esc(x)+'</button>'}).join('')+'</div>'}
async function mark(i){let phrase=player.bingo_board&&player.bingo_board[i],drawn=Object.values(state.drawn_bingo_phrases||{});if(!phrase||!drawn.includes(phrase))return alert('This evidence has not been drawn yet.');await g.ref('').transaction(root=>{let p=root&&root.players&&root.players[me],s=root&&root.game_state;if(!p||!s||s.bingo_cutoff)return root;p.bingo_marks||={};p.bingo_marks[i]=true;let lines=g.lineCount(p.bingo_marks);p.bingo_lines=lines;if(lines<2||p.bingo_completed_at)return root;s.bingo_finishers||={};let ids=Object.keys(s.bingo_finishers),bucket=Math.floor(Date.now()/1000);if(ids.length<10||s.bingo_cutoff_bucket===bucket){p.bingo_completed_at=firebase.database.ServerValue.TIMESTAMP;s.bingo_finishers[me]=bucket;if(ids.length+1>=10){s.bingo_cutoff=true;s.bingo_cutoff_bucket=bucket}}return root})}
async function library(){let c=(await g.ref('clues').once('value')).val()||{},out=[];for(let n=3;n>=1;n--)for(const id of player.clue_library?.['level'+n]||[]){let x=c['level'+n]?.[id];out.push('<li class="rounded border border-slate-700 p-2">L'+n+' · '+esc(typeof x==='string'?x:x?.text||x?.clue||id)+'</li>')}return out.length?'<ul class="mb-5 space-y-2 text-sm">'+out.join('')+'</ul>':'<p class="mb-5 text-sm text-slate-400">No evidence collected yet.</p>'}
function render(){if(!player||!state)return;$('phase').textContent=(state.current_phase||'ONBOARDING').replaceAll('_',' ');let h='Waiting for the host…',p=state.current_phase;if(p==='GAME1_QUIZ')h='<div id="q">Loading case…</div>';if(p==='GAME2_BINGO')h='<div id="b">Loading board…</div>';if(p==='GAME3_TEAM_SELECT')h='<p class="mb-4">Choose a side. This is separate from your final prediction.</p><button onclick="team(\'boy\')" class="w-full mb-3 bg-blue-500 p-4 font-bold">TEAM BOY</button><button onclick="team(\'girl\')" class="w-full bg-pink-500 p-4 font-bold">TEAM GIRL</button>';if(p==='FINAL_CHOICE')h='<p class="mb-2">Your evidence library</p><div id="lib">Loading evidence…</div><p class="mb-4">Your final prediction cannot be changed.</p><button onclick="predict(\'boy\')" class="w-full mb-3 bg-blue-500 p-4 font-bold">BOY</button><button onclick="predict(\'girl\')" class="w-full bg-pink-500 p-4 font-bold">GIRL</button>';if(p==='GRAND_REVEAL')h='<p class="text-6xl font-black text-center '+(state.revealed_gender==='boy'?'text-blue-400':'text-pink-400')+'">'+(state.revealed_gender||'').toUpperCase()+'</p>';$('content').innerHTML=h;if(p==='GAME1_QUIZ')game1().then(x=>$('q').innerHTML=x);if(p==='GAME2_BINGO')bingo().then(x=>$('b').innerHTML=x);if(p==='FINAL_CHOICE')library().then(x=>$('lib').innerHTML=x)}function team(v){g.ref('players/'+me).update({team:v})}function predict(v){g.ref('players/'+me).transaction(p=>{if(p&&!p.final_prediction)p.final_prediction=v;return p})}window.answer=answer;window.mark=mark;window.team=team;window.predict=predict;if(g.init()){g.ensureState();show()}
</script><script>
/* The second listener intentionally takes over only during the cinematic reveal. */
function revealPhone(){if(!state||state.current_phase!=='GRAND_REVEAL')return;let left=Math.max(0,Math.ceil(((state.reveal_countdown_ends_at||0)-Date.now())/1000));if(left){$('phase').textContent='FINAL COUNTDOWN';$('content').innerHTML='<p class="text-center text-8xl font-black text-amber-300">'+left+'</p><p class="mt-5 text-center font-mono text-sm">CASE FILE UNSEALING…</p>';return}let x=state.reveal_stats||{},correct=player&&player.final_prediction===state.revealed_gender;$('phase').textContent="IT'S A "+String(state.revealed_gender||'').toUpperCase();$('content').innerHTML='<p class="text-center text-5xl font-black '+(state.revealed_gender==='boy'?'text-blue-400':'text-pink-400')+'">'+String(state.revealed_gender||'').toUpperCase()+'</p><p class="mt-6 text-center '+(correct?'text-cyan-300':'text-slate-300')+'">'+(player?.final_prediction?(correct?'YOUR PREDICTION WAS CORRECT':'Your final prediction: '+player.final_prediction.toUpperCase()):'No final prediction submitted')+'</p><p class="mt-4 text-center text-sm text-slate-400">'+(x.percent??0)+'% of submitted predictions were correct</p>'}if(g.init()){g.stateRef.on('value',s=>{state=s.val()||{};revealPhone()});setInterval(revealPhone,200)}
</script><script>
function settlementPhone(){if(!player||!state)return;if(state.current_phase==='GAME1_SETTLE'){$('phase').textContent='CASE 01 · SETTLED';$('content').innerHTML='<p class="text-4xl font-black text-cyan-300">'+(player.game1_score||0)+' PTS</p><p class="mt-4">'+(player.awards?.game1?'A new evidence clue has been filed.':'Results are being filed…')+'</p>'}if(state.current_phase==='GAME2_SETTLE'){$('phase').textContent='EVIDENCE BOARD · SETTLED';$('content').innerHTML='<p class="text-2xl font-bold">'+(player.bingo_lines||0)+' line(s) completed</p><p class="mt-4">'+(player.awards?.game2?'Your new evidence clue(s) are in the library.':'Results are being filed…')+'</p>'}}if(g.init()){g.ref('players/'+me).on('value',s=>{player=s.val()||player;settlementPhone()});g.stateRef.on('value',s=>{state=s.val()||{};settlementPhone()})}
</script></body></html>
