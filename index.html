<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Reveal — Player</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="config.js"></script></head><body class="min-h-screen bg-slate-950 text-stone-100"><main class="mx-auto max-w-md p-6"><p class="font-mono text-xs tracking-[.25em] text-cyan-300">CASE REVEAL / PLAYER</p><h1 class="mt-8 text-5xl font-black leading-none">JOIN THE<br>INVESTIGATION</h1><section id="join" class="mt-10 space-y-4"><input id="name" class="w-full rounded border border-slate-600 bg-slate-900 p-4" placeholder="Your name"><select id="group" class="w-full rounded border border-slate-600 bg-slate-900 p-4"></select><button id="joinBtn" class="w-full rounded bg-cyan-400 p-4 font-bold text-slate-950">GET MY CASE PIN</button></section><section id="game" class="hidden mt-10"><p id="pin" class="font-mono text-cyan-300"></p><h2 id="phase" class="mt-3 text-2xl font-bold"></h2><div id="content" class="mt-6"></div></section></main><script>
const g=Game; const $=id=>document.getElementById(id); const C=GENDER_REVEAL_CONFIG; C.groups.forEach(([id,n])=>$('group').add(new Option(n,id)));
let me=localStorage.caseRevealPlayer; async function join(){if(!g.configured)return alert('Firebase has not been configured in config.js.');const name=$('name').value.trim();if(!name)return alert('Please enter your name.');const pin=await g.uniquePin();const r=g.ref('players').push();await r.set({name,group:$('group').value,pin,joined_at:g.now(),score:0,clue_library:{level1:[],level2:[],level3:[]}});localStorage.caseRevealPlayer=r.key;me=r.key;show();} $('joinBtn').onclick=join;
function show(){if(!me)return; $('join').classList.add('hidden');$('game').classList.remove('hidden');g.ref('players/'+me).on('value',s=>{let p=s.val();if(!p){localStorage.removeItem('caseRevealPlayer');location.reload();return}$('pin').textContent='CASE PIN  '+p.pin});g.stateRef.on('value',s=>render(s.val()||{}));}
function render(s){$('phase').textContent=(s.current_phase||'ONBOARDING').replaceAll('_',' ');let h='Waiting for the host…';if(s.current_phase==='GAME3_TEAM_SELECT')h='<p class="mb-4">Choose a side. This is separate from your final prediction.</p><button onclick="team(\'boy\')" class="w-full mb-3 bg-blue-500 p-4 font-bold">TEAM BOY</button><button onclick="team(\'girl\')" class="w-full bg-pink-500 p-4 font-bold">TEAM GIRL</button>';if(s.current_phase==='FINAL_CHOICE')h='<p class="mb-4">Your final prediction cannot be changed.</p><button onclick="predict(\'boy\')" class="w-full mb-3 bg-blue-500 p-4 font-bold">BOY</button><button onclick="predict(\'girl\')" class="w-full bg-pink-500 p-4 font-bold">GIRL</button>';if(s.current_phase==='GRAND_REVEAL')h='<p class="text-6xl font-black text-center '+(s.revealed_gender==='boy'?'text-blue-400':'text-pink-400')+'">'+(s.revealed_gender||'').toUpperCase()+'</p>';$('content').innerHTML=h;} function team(v){g.ref('players/'+me).update({team:v})} function predict(v){g.ref('players/'+me).transaction(p=>{if(p&&!p.final_prediction)p.final_prediction=v;return p})} if(g.init()){g.ensureState();show()}
</script></body></html>
