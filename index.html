<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偵探解密：BB 性別大追查</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>🕵️‍♂️ BB 性別大追查 🕵️‍♀️</h1>
            <p id="player-badge">請先登記偵探身份</p>
        </div>

        <section id="step-LOGIN" class="view-section active">
            <h2>🕵️‍♂️ 偵探任務簡報</h2>
            <div style="background: rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; text-align: left; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; border-left: 4px solid var(--accent);">
                <p style="margin-bottom: 8px;">大家而家會化身成為一個偵探，參加呢個派對既目標就係去揭破一個驚天大秘密：「BB 既性別」。</p>
                <p style="margin-bottom: 8px;">係呢個過程入面，你將會受到不同既考驗，鬥智鬥力，最後到達決戰之地，帶住你認為係岩既答案，與共同答案既同伴連成一線，對抗另一隊自認為岩既隊伍。</p>
                <p style="margin-bottom: 0; font-weight: bold; color: var(--accent);">到底係男仔，定係女仔呢？一切一切就等你黎揭曉啦！！！！</p>
            </div>
        
            <div class="form-group">
                <label>代號／名字：</label>
                <input type="text" id="player-name-input" placeholder="例如：Alex">
            </div>
            <div class="form-group">
                <label>所屬 Group：</label>
                <select id="player-group-select">
                    <option value="">-- 請選擇 --</option>
                </select>
            </div>
            <button id="btn-join-app" class="btn">進入現場</button>
        </section>

        <section id="step-GAME1" class="view-section">
            <h3>🔍 Game 1：偵探入場券</h3>
            <div id="g1-container">
                <p id="g1-q-title" style="font-weight: bold; margin-bottom: 10px;">等待題目中...</p>
                <div id="g1-opts-box" class="options-grid"></div>
            </div>
        </section>

        <section id="step-GAME2" class="view-section">
            <h3>🧩 Game 2：線索 Bingo</h3>
            <p style="font-size:0.8rem; opacity:0.8;">點擊連成 1 條線以解鎖終極提示！</p>
            <div id="bingo-board-grid" class="bingo-grid"></div>
        </section>

        <section id="step-GAME3" class="view-section">
            <h3>⚔️ Game 3：陣營搶答</h3>
            <div class="team-selector">
                <button class="team-btn boy" id="btn-team-boy">👦 TEAM BOY</button>
                <button class="team-btn girl" id="btn-team-girl">👧 TEAM GIRL</button>
            </div>
            <div id="g3-container" style="margin-top: 15px;">
                <p id="g3-q-title" style="font-weight: bold; margin-bottom: 10px;">等待搶答開始...</p>
                <div id="g3-opts-box" class="options-grid"></div>
            </div>
        </section>

        <section id="step-REVEAL" class="view-section">
            <h2 style="text-align: center;">🎉 終極揭曉倒數</h2>
            <div id="countdown-timer-display" class="timer-display">10</div>
            <div id="final-gender-result" class="reveal-result"></div>
        </section>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
