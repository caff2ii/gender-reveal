<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Reveal — Secret</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="config.js"></script></head><body class="min-h-screen bg-slate-950 p-8 text-stone-100"><main class="mx-auto max-w-xl"><p class="font-mono text-xs tracking-[.25em] text-amber-300">CLASSIFIED / SECRET SETTING</p><div id="lock" class="mt-8"><input id="pass" type="password" class="w-full rounded bg-slate-800 p-3" placeholder="Password"><button class="mt-3 w-full rounded bg-amber-300 p-3 font-bold text-slate-950" onclick="unlock()">UNLOCK</button></div><section id="panel" class="hidden mt-8"><h1 class="text-3xl font-black">Set reveal result</h1><p id="status" class="mt-3 text-slate-300"></p><button onclick="setGender('boy')" class="mt-5 mr-2 rounded bg-blue-500 px-5 py-3 font-bold">LOCK BOY</button><button onclick="setGender('girl')" class="mt-5 rounded bg-pink-500 px-5 py-3 font-bold">LOCK GIRL</button><button onclick="reveal()" class="mt-8 block rounded bg-amber-300 px-5 py-3 font-bold text-slate-950">START GRAND REVEAL</button></section></main><script>let unlocked=false;function unlock(){if(document.querySelector('#pass').value!==GENDER_REVEAL_CONFIG.adminPassword)return alert('Incorrect password');unlocked=true;document.querySelector('#lock').classList.add('hidden');document.querySelector('#panel').classList.remove('hidden');Game.init();Game.ref('secret_gender').on('value',s=>document.querySelector('#status').textContent=s.val()?'Currently locked: '+String(s.val()).toUpperCase():'Not set yet')}async function setGender(v){if(!unlocked)return;await Game.ref('secret_gender').set(v);alert('Secret result locked. Return here with the password to change it.')}async function reveal(){const v=(await Game.ref('secret_gender').once('value')).val();if(v!=='boy'&&v!=='girl')return alert('Set the secret gender first.');await Game.stateRef.update({current_phase:'GRAND_REVEAL',revealed_gender:v,phase_changed_at:Game.now()})}window.unlock=unlock;window.setGender=setGender;window.reveal=reveal;</script></body></html>
