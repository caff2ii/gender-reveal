<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Reveal Party - Secret</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-app-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-database-compat.js"></script>
    
    <!-- Config -->
    <script src="config.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background-color: #0d0d0d;
            color: #f8f8f8;
            min-height: 100vh;
        }
        
        .font-mono {
            font-family: 'IBM Plex Mono', monospace;
        }
        
        /* Secret page styling */
        .secret-page {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .secret-card {
            background: rgba(26, 26, 26, 0.9);
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }
        
        /* Password gate styling */
        .password-gate {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
        }
        
        .password-card {
            background: rgba(26, 26, 26, 0.9);
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
        }
        
        /* Gender selection buttons */
        .gender-btn {
            background: #1a1a1a;
            border: 2px solid #334155;
            color: #f8f8f8;
            padding: 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0.5rem;
            flex: 1;
        }
        
        .gender-btn:hover {
            border-color: #475569;
            transform: translateY(-2px);
        }
        
        .gender-btn.selected {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.1);
        }
        
        .gender-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Lock button */
        .lock-btn {
            background: #334155;
            color: #f8f8f8;
            padding: 1rem 2rem;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 1rem;
        }
        
        .lock-btn:hover {
            background: #475569;
        }
        
        .lock-btn.locked {
            background: #ef4444;
        }
        
        .lock-btn.locked:hover {
            background: #dc2626;
        }
        
        /* Form styling */
        .form-input {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #334155;
            color: #f8f8f8;
            padding: 0.75rem;
            border-radius: 4px;
            transition: border-color 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #f97316;
        }
        
        /* Status display */
        .status-display {
            background: rgba(26, 26, 26, 0.6);
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
        }
        
        .status-locked {
            color: #ef4444;
        }
        
        .status-unlocked {
            color: #22c55e;
        }
        
        /* Unlock button */
        .unlock-btn {
            background: #f97316;
            color: #0d0d0d;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        
        .unlock-btn:hover {
            background: #ea580c;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #334155;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Warning styling */
        .warning-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            border-radius: 4px;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 0.875rem;
        }
        
        /* Hidden class */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
        </div>
        
        <!-- Password Gate -->
        <div id="password-gate" class="password-gate hidden">
            <div class="password-card">
                <h1 class="text-2xl font-bold mb-6 text-center">SECRET ACCESS</h1>
                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-2 font-mono">PASSWORD</label>
                    <input type="password" id="password-input" class="form-input" placeholder="Enter password">
                </div>
                <button id="login-btn" class="w-full bg-orange-500 text-black font-bold py-3 px-4 rounded-lg hover:bg-orange-600 transition-colors">
                    ACCESS
                </button>
                <p id="password-error" class="text-red-500 text-sm mt-4 text-center hidden">Incorrect password</p>
            </div>
        </div>
        
        <!-- Secret Selection Page -->
        <div id="secret-page" class="secret-page hidden">
            <div class="secret-card">
                <h1 class="text-2xl font-bold mb-2 text-center">SECRET GENDER</h1>
                <p class="text-gray-400 text-sm text-center mb-6 font-mono">CLASSIFIED INFORMATION</p>
                
                <div id="unlock-section" class="hidden">
                    <p class="text-sm text-gray-400 mb-4 text-center">Enter password to unlock:</p>
                    <input type="password" id="unlock-password" class="form-input mb-2" placeholder="Password">
                    <button id="unlock-btn" class="unlock-btn w-full">UNLOCK</button>
                </div>
                
                <div id="gender-selection">
                    <div class="flex gap-4 mb-4">
                        <button id="boy-btn" class="gender-btn">
                            👦 BOY
                        </button>
                        <button id="girl-btn" class="gender-btn">
                            👧 GIRL
                        </button>
                    </div>
                    
                    <button id="lock-btn" class="lock-btn">
                        🔒 LOCK SELECTION
                    </button>
                </div>
                
                <div id="status-display" class="status-display">
                    <div id="current-selection" class="text-xl font-bold mb-2">NOT SET</div>
                    <div id="lock-status" class="font-mono text-sm">UNLOCKED</div>
                </div>
                
                <div class="warning-box">
                    <p class="font-bold mb-1">⚠️ IMPORTANT</p>
                    <p class="text-gray-400">Once locked, the selection cannot be changed without re-entering the password. This setting is critical for the game reveal.</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Firebase initialization
        firebase.initializeApp(window.CONFIG.firebaseConfig);
        const database = firebase.database();
        
        // State
        let isAuthenticated = false;
        let currentSelection = null;
        let isLocked = false;
        
        // DOM Elements
        const loadingEl = document.getElementById('loading');
        const passwordGateEl = document.getElementById('password-gate');
        const secretPageEl = document.getElementById('secret-page');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const passwordError = document.getElementById('password-error');
        const boyBtn = document.getElementById('boy-btn');
        const girlBtn = document.getElementById('girl-btn');
        const lockBtn = document.getElementById('lock-btn');
        const currentSelectionEl = document.getElementById('current-selection');
        const lockStatusEl = document.getElementById('lock-status');
        const unlockSection = document.getElementById('unlock-section');
        const unlockPassword = document.getElementById('unlock-password');
        const unlockBtn = document.getElementById('unlock-btn');
        const genderSelection = document.getElementById('gender-selection');
        
        // Initialize
        function init() {
            // Check localStorage for auth state
            const savedAuth = localStorage.getItem('secretAuth');
            if (savedAuth === 'true') {
                isAuthenticated = true;
                showSecretPage();
            } else {
                showPasswordGate();
            }
            
            // Load current secret gender
            loadSecretGender();
        }
        
        function showPasswordGate() {
            loadingEl.classList.add('hidden');
            passwordGateEl.classList.remove('hidden');
            secretPageEl.classList.add('hidden');
        }
        
        function showSecretPage() {
            loadingEl.classList.add('hidden');
            passwordGateEl.classList.add('hidden');
            secretPageEl.classList.remove('hidden');
        }
        
        function loadSecretGender() {
            database.ref(window.CONFIG.dbPaths.secretGender).on('value', (snapshot) => {
                const gender = snapshot.val();
                currentSelection = gender;
                updateUI();
            });
        }
        
        function updateUI() {
            // Update selection display
            if (currentSelection === 'BOY') {
                currentSelectionEl.textContent = '👦 BOY';
                boyBtn.classList.add('selected');
                girlBtn.classList.remove('selected');
            } else if (currentSelection === 'GIRL') {
                currentSelectionEl.textContent = '👧 GIRL';
                girlBtn.classList.add('selected');
                boyBtn.classList.remove('selected');
            } else {
                currentSelectionEl.textContent = 'NOT SET';
                boyBtn.classList.remove('selected');
                girlBtn.classList.remove('selected');
            }
            
            // Update lock status
            if (isLocked) {
                lockStatusEl.textContent = '🔒 LOCKED';
                lockStatusEl.classList.add('status-locked');
                lockStatusEl.classList.remove('status-unlocked');
                lockBtn.textContent = 'LOCKED';
                lockBtn.classList.add('locked');
                genderSelection.classList.add('hidden');
                unlockSection.classList.remove('hidden');
            } else {
                lockStatusEl.textContent = '🔓 UNLOCKED';
                lockStatusEl.classList.remove('status-locked');
                lockStatusEl.classList.add('status-unlocked');
                lockBtn.textContent = '🔒 LOCK SELECTION';
                lockBtn.classList.remove('locked');
                genderSelection.classList.remove('hidden');
                unlockSection.classList.add('hidden');
            }
        }
        
        // Event Listeners
        loginBtn.addEventListener('click', () => {
            const password = passwordInput.value;
            if (password === window.CONFIG.adminPassword) {
                isAuthenticated = true;
                localStorage.setItem('secretAuth', 'true');
                showSecretPage();
            } else {
                passwordError.classList.remove('hidden');
                passwordInput.value = '';
            }
        });
        
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });
        
        boyBtn.addEventListener('click', () => {
            if (!isLocked) {
                currentSelection = 'BOY';
                database.ref(window.CONFIG.dbPaths.secretGender).set('BOY');
                updateUI();
            }
        });
        
        girlBtn.addEventListener('click', () => {
            if (!isLocked) {
                currentSelection = 'GIRL';
                database.ref(window.CONFIG.dbPaths.secretGender).set('GIRL');
                updateUI();
            }
        });
        
        lockBtn.addEventListener('click', () => {
            if (!isLocked && currentSelection) {
                isLocked = true;
                updateUI();
            }
        });
        
        unlockBtn.addEventListener('click', () => {
            const password = unlockPassword.value;
            if (password === window.CONFIG.adminPassword) {
                isLocked = false;
                unlockPassword.value = '';
                updateUI();
            } else {
                alert('Incorrect password');
            }
        });
        
        unlockPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                unlockBtn.click();
            }
        });
        
        // Start initialization
        init();
    </script>
</body>
</html>
