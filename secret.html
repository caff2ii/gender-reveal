<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLASSIFIED - Secret Gender Management</title>
  <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-center items-center p-4 font-mono">

  <div id="password-gate" class="w-full max-w-md bg-gray-800 border border-red-600 rounded-lg p-6 shadow-2xl">
    <div class="text-center mb-6">
      <span class="inline-block px-3 py-1 bg-red-900 text-red-200 text-xs font-bold tracking-widest uppercase rounded mb-2">Restricted Access</span>
      <h1 class="text-2xl font-black text-white tracking-wider">SECRET GENDER GATE</h1>
      <p class="text-xs text-gray-400 mt-1">AUTHORIZATION REQUIRED (PASS: 1125)</p>
    </div>
    <form id="gate-form" onsubmit="handleAuth(event)">
      <input type="password" id="gate-pass" class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-3 text-center text-xl tracking-widest text-white focus:outline-none focus:border-red-500 mb-4" placeholder="ENTER PIN" maxlength="10" required>
      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded transition uppercase tracking-widest">Verify Access</button>
    </form>
    <p id="gate-err" class="text-red-500 text-xs text-center mt-3 hidden">INVALID SECURITY PIN</p>
  </div>

  <div id="control-panel" class="w-full max-w-md bg-gray-800 border border-gray-700 rounded-lg p-6 shadow-2xl hidden">
    <div class="border-b border-gray-700 pb-4 mb-6 text-center">
      <div class="text-xs text-gray-500 tracking-widest uppercase">TOP SECRET // CONFIDENTIAL</div>
      <h2 class="text-xl font-bold text-white mt-1">GENDER DETERMINATION</h2>
      <div id="status-badge" class="mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold bg-yellow-900 text-yellow-300">
        STATUS: UNLOCKED
      </div>
    </div>

    <div class="bg-gray-900 p-4 rounded border border-gray-700 mb-6 text-center">
      <span class="text-xs text-gray-400 block mb-1">DATABASE SECRET VALUE:</span>
      <span id="current-gender" class="text-3xl font-black tracking-widest text-gray-500">LOADING...</span>
    </div>

    <div id="selection-controls" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <button id="btn-boy" onclick="selectGender('BOY')" class="py-4 rounded font-black text-lg border-2 border-blue-500 text-blue-400 hover:bg-blue-900 transition">
          BOY ♂
        </button>
        <button id="btn-girl" onclick="selectGender('GIRL')" class="py-4 rounded font-black text-lg border-2 border-pink-500 text-pink-400 hover:bg-pink-900 transition">
          GIRL ♀
        </button>
      </div>

      <button id="btn-lock" onclick="toggleLock(true)" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 rounded tracking-widest uppercase transition">
        🔒 LOCK SELECTION
      </button>
    </div>

    <div id="locked-controls" class="hidden space-y-4">
      <div class="bg-red-950 border border-red-800 text-red-300 p-3 rounded text-xs text-center">
        ⚠️ Selection is currently locked to prevent accidental changes during the party.
      </div>
      <button onclick="toggleLock(false)" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded tracking-widest uppercase transition">
        🔓 UNLOCK (REQUIRE RE-VERIFY)
      </button>
    </div>
  </div>

  <script>
    firebase.initializeApp(window.CONFIG.firebase);
    const db = firebase.database();
    let isLockedState = false;

    function handleAuth(e) {
      e.preventDefault();
      const inputPass = document.getElementById('gate-pass').value;
      if (inputPass === window.CONFIG.passwords.secret) {
        document.getElementById('password-gate').classList.add('hidden');
        document.getElementById('control-panel').classList.remove('hidden');
        initSecretPanel();
      } else {
        document.getElementById('gate-err').classList.remove('hidden');
      }
    }

    function initSecretPanel() {
      db.ref('secret_gender').on('value', snapshot => {
        const val = snapshot.val() || "UNSET";
        const display = document.getElementById('current-gender');
        display.innerText = val;
        
        if (val === 'BOY') {
          display.className = 'text-3xl font-black tracking-widest text-blue-400';
        } else if (val === 'GIRL') {
          display.className = 'text-3xl font-black tracking-widest text-pink-400';
        } else {
          display.className = 'text-3xl font-black tracking-widest text-yellow-500';
        }
      });
    }

    function selectGender(gender) {
      if (isLockedState) return;
      db.ref('secret_gender').set(gender).then(() => {
        alert(`Secret Gender set to: ${gender}`);
      }).catch(err => alert("Error: " + err.message));
    }

    function toggleLock(shouldLock) {
      if (!shouldLock) {
        const pass = prompt("Enter PIN 1125 to unlock control:");
        if (pass !== window.CONFIG.passwords.secret) {
          alert("Incorrect Password!");
          return;
        }
      }

      isLockedState = shouldLock;
      const statusBadge = document.getElementById('status-badge');
      const selectionControls = document.getElementById('selection-controls');
      const lockedControls = document.getElementById('locked-controls');

      if (isLockedState) {
        statusBadge.className = 'mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold bg-red-900 text-red-200';
        statusBadge.innerText = 'STATUS: LOCKED';
        selectionControls.classList.add('hidden');
        lockedControls.classList.remove('hidden');
      } else {
        statusBadge.className = 'mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold bg-yellow-900 text-yellow-300';
        statusBadge.innerText = 'STATUS: UNLOCKED';
        selectionControls.classList.remove('hidden');
        lockedControls.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
