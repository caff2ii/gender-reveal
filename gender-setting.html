<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保密設定 - 最終性別</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .secret-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px dashed #444;
            padding-bottom: 10px;
        }
        
        .header h1 {
            color: var(--accent);
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        
        .header p {
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .warning-box {
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid #f44336;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            color: #ffb3b3;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .setting-panel { display: none; }
        .setting-panel.active { display: block; }
        
        .gender-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .gender-btn {
            padding: 30px 15px;
            border: 3px solid #555;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        
        .gender-btn:hover {
            transform: scale(1.03);
        }
        
        .gender-btn.boy { border-color: var(--boy-color); }
        .gender-btn.girl { border-color: var(--girl-color); }
        
        .gender-btn.boy.active {
            background: var(--boy-color);
            color: #000;
            box-shadow: 0 0 25px rgba(74, 144, 226, 0.6);
        }
        
        .gender-btn.girl.active {
            background: var(--girl-color);
            color: #000;
            box-shadow: 0 0 25px rgba(245, 166, 35, 0.6);
        }
        
        .status-card {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 10px;
        }
        
        .status-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        
        .status-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }
        
        .btn-clear {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #555;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-clear:hover {
            background: #777;
        }
    </style>
</head>
<body>
    <div class="secret-container">
        <div class="header">
            <h1>🔒 保密設定</h1>
            <p>最終性別設定（僅限知情人）</p>
        </div>

        <div class="warning-box">
            ⚠️ 此頁面內容屬最高機密！<br>
            請確保設定時冇其他人睇到螢幕。
        </div>

        <!-- 設定面板（登入後顯示） -->
        <div class="setting-panel active" id="setting-panel">
            <div class="gender-selector">
                <button class="gender-btn boy" id="btn-set-boy">👦<br>男寶寶</button>
                <button class="gender-btn girl" id="btn-set-girl">👧<br>女寶寶</button>
            </div>

            <div class="status-card">
                <div class="status-label">目前設定</div>
                <div class="status-value" id="current-gender-display">載入中...</div>
                <button class="btn-clear" id="btn-clear-gender">🗑️ 清除設定</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/gender-setting.js"></script>
</body>
</html>
